  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Profile Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <body>
      <div id="sidebar-container"></div>
    <div id="content-wrapper" class="sidebar-hidden">
        <div id="navbar-container" class="fixed-top"></div>

      <!-- Personal Details Section -->
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-12 col-lg-11">
            <div class="card personal-details-card w-100" style="margin: 2rem;">
              <div class="personal-details-header mb-4">
                <h4 class="fw-bold personal-details-title mb-0">Profile Settings</h4>
                <div class="personal-details-underline"></div>
              </div>
              <div class="personal-details-btn-group mb-4">
                <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile" class="rounded-circle personal-details-avatar">
                <button class="btn btn-purple">Upload New</button>
                <button class="btn personal-details-remove">Remove Profile Photo</button>
              </div>
              <form>
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Full Name</label>
                    <input type="text" class="form-control input-icon-right icon-user w-100" placeholder="somia ali mohmad" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Email</label>
                    <input type="email" class="form-control input-icon-right icon-envelope w-100" placeholder="aliahmed@gimal.com" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Phone Number</label>
                    <input type="text" class="form-control phone-code phone-icon-right w-100" placeholder="01016424526" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">National ID</label>
                    <input type="number" class="no-spinner form-control input-icon-right icon-idcard w-100" placeholder="Enter Your National ID" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Gender</label>
                    <div id="gender-select-group" style="position:relative;">
                      <input type="text" class="form-control input-icon-right icon-venus-mars w-100" id="gender_input" name="gender_input" placeholder="Select your gender" readonly style="background-color:#fff; cursor:pointer;">
                      <ul id="gender-dropdown" class="gender-dropdown-list">
                        <li data-value="male"><span>Male</span></li>
                        <li data-value="female"><span>Female</span></li>
                      </ul>
                      <input type="hidden" name="gender" id="gender_hidden">
                      <span id="gender-arrow" style="position:absolute; right:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; pointer-events:none; transition:transform 0.2s;">
                        <img src="./assets/iconsax-arrow-down-02.png" alt="arrow" style="width:100%;height:100%;display:block;transition:transform 0.2s;">
                      </span>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Google Account</label>
                    <input type="text" class="form-control input-icon-right icon-google w-100" placeholder="Enter Your Google Account" />
                  </div>
                </div>
                <div class="d-flex flex-column align-items-center mt-4 gap-3">
                  <button type="submit" class="btn btn-purple personal-details-save">Save Changes</button>
                  <button type="button" class="btn btn-light d-flex align-items-center icon-google justify-content-center personal-details-google" style="margin-bottom: 20px;">
                    <img src="./assets/Group 4.png" alt="Google" class="me-2 personal-details-google-img" >
                    Change Google account
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <!-- End Personal Details Section -->
    </div>
    <script>
      // Fetch and inject sidebar
      fetch('./components/sidebar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('sidebar-container').innerHTML = html;
        });
      // Fetch and inject navbar
      fetch('./components/navbar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('navbar-container').innerHTML = html;
        });
      // Sidebar toggle logic (example, adjust as needed)
      function toggleSidebar(active) {
        const contentWrapper = document.getElementById('content-wrapper');
        if (active) {
          contentWrapper.style.marginLeft = '250px'; // Adjust to your sidebar width
        } else {
          contentWrapper.style.marginLeft = '0';
        }
      }
      // Optionally, call toggleSidebar(true/false) based on sidebar state

      // Custom gender dropdown logic
      (function() {
        const genderInput = document.getElementById('gender_input');
        const genderDropdown = document.getElementById('gender-dropdown');
        const genderGroup = document.getElementById('gender-select-group');
        const genderHidden = document.getElementById('gender_hidden');
        const genderArrow = document.getElementById('gender-arrow').querySelector('img');

        function toggleDropdown() {
          genderDropdown.classList.toggle('open');
          if (genderDropdown.classList.contains('open')) {
            genderArrow.style.transform = 'rotate(180deg)';
          } else {
            genderArrow.style.transform = 'rotate(0deg)';
          }
        }

        function closeDropdown(e) {
          if (!genderGroup.contains(e.target)) {
            genderDropdown.classList.remove('open');
            genderArrow.style.transform = 'rotate(0deg)';
          }
        }

        genderInput.addEventListener('click', toggleDropdown);

        genderDropdown.querySelectorAll('li').forEach(li => {
          li.addEventListener('click', function() {
            genderInput.value = li.textContent;
            genderHidden.value = li.getAttribute('data-value');
            // Remove active from all, add to selected
            genderDropdown.querySelectorAll('li').forEach(item => item.classList.remove('active'));
            li.classList.add('active');
            genderDropdown.classList.remove('open');
            genderArrow.style.transform = 'rotate(0deg)';
          });
        });

        document.addEventListener('mousedown', closeDropdown);
      })();
    </script>

    <script src="./js/loading.js"></script>

  </body>

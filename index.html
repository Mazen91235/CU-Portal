<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Portal</title>
  <link rel="stylesheet" href="./css/styleindex.css" />
</head>
<body>
  <!-- Header -->
  <header class="main-header">

    <div class="header-left">
      St<span class="highlight">u</span>dent P<span class="highlight">o</span>rtal
    </div>

    <nav class="header-center">
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">How to Start</a>
      <a href="#">Snapshots</a>
    </nav>
    <div class="header-right">
      <button class="btn login">Login</button>
      <button class="btn signup">Sign Up</button>
    </div>
    
    
    
  </header>
  <div class="line"> </div>
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-text">
      <h1>
        Simplify Your Student Life<br/>
        <span class="gradient-text">Succeed Smarter</span>
      </h1>
      <p>Organize your studies, track your progress, and connect with your academic community.</p>
      <a href="#" class="cta-button">Get started now!</a>
    </div>
    <div class="hero-image">
      <img src="students.png" alt="Illustration of two students with books">
    </div>
  </section>
  <script>
document.querySelectorAll('.header-center a').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    
    // Remove 'active' from all links
    document.querySelectorAll('.header-center a').forEach(el => {
      el.classList.remove('active');
    });
    
    // Add 'active' to the clicked link
    link.classList.add('active');
  });
});
  </script>
</body>
</html>

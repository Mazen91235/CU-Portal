<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Reset Password</title>
    <link rel="stylesheet" href="/StudentsPortal-CU/css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="container grey-bg">
        <header class="header">
            <h1 class="logo">St<span class="orangered">u</span>dent P<span class="orangered">o</span>rtal</h1>
        </header>

        <div class="content-wrapper password-reset-page">
            <div class="reset-password-content">
                <div class="icon-circle centered-icon">
                    <span class="material-icons">update</span>
                </div>
                <h2>Reset password</h2>
                <p class="instruction-text">
                    Enter the email associated with your account and we will send an email with instructions to reset your password
                </p>
                <form class="reset-password-form">
                    <label for="email-address">Email address</label>
                    <div class="input-group email-input">
                        <input type="email" id="email-address" value="somila@outlook.com">
                    </div>
                    <button type="submit" class="btn primary-btn">Send Password Reset Link</button>
                    <div class="timer-box">00:56</div>
                    <a href="#" class="back-to-login grey-link no-underline">&larr; Back to login</a>
                </form>
            </div>
        </div>

        <div class="background-shape-top-right light-purple"></div>
        <div class="background-shape-bottom-left light-beige"></div>
    </div>
</body>
</html>

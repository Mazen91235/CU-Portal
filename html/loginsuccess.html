<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Google Linked</title>
    <link rel="stylesheet" href="/StudentsPortal-CU/css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body style="background-color: white;">
    <div class="container grey-bg">
        <img src="/StudentsPortal-CU/assets/topright (1).png" alt="Decorative background element" class="corner-image-top-right">
        <img src="/StudentsPortal-CU/assets/topright (2).png" alt="Decorative background element" class="corner-image-bottom-left">
        <header class="header">
            <h1 class="logo">Student Portal</h1>
        </header>

        <div class="content-wrapper google-linked-page">
            <div class="illustration">
                <img src="/StudentsPortal-CU/assets/a011f92672ccbe9d6137861d6fbf9cde95308f2c.png" alt="Happy student illustration">
            </div>
            <div class="card success-card">
                <div class="icon-circle success">
                    <span class="material-icons">check</span>
                </div>
                <h2>Google Account Linked Successfully</h2>
                <p>Now let's finish setting up your profile. Just a few quick steps to personalize your experience</p>
                <button class="btn primary-btn">Create Profile Now &rarr;</button>
            </div>
        </div>

        </div>

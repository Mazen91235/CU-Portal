<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Welcome</title>
    <link rel="stylesheet" href="/StudentsPortal-CU/css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">St<span class="orangered">u</span>dent P<span class="orangered">o</span>rtal</h1>
        </header>

        <div class="content-wrapper welcome-page">
            <div class="illustration">
                <img src="/StudentsPortal-CU/assets/a011f92672ccbe9d6137861d6fbf9cde95308f2c.png" alt="Happy student illustration">
            </div>
            <div class="card welcome-card">
                <h2 class="gradient-text-h2">Hello,<br>welcome back</h2>
                <p>You need to sign in with Google to continue</p>
                <button class="google-signin-btn">
                    <img src="/StudentsPortal-CU/assets/icons8-google 1.svg" alt="Google icon" class="google-icon">
                    Sign up / in with Google
                </button>
            </div>
        </div>

        <div class="background-shape-top-right"></div>
        <div class="background-shape-bottom-left"></div>
    </div>
</body>
</html>

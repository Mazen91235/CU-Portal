<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Welcome</title>
    <link rel="stylesheet" href="/StudentsPortal-CU/css/style.css   ">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Create New Password</title>
    <link rel="stylesheet" href="/StudentsPortal-CU/css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="container grey-bg">
        <header class="header">
            <h1 class="logo">St<span class="orangered">u</span>dent P<span class="orangered">o</span>rtal</h1>
        </header>

        <div class="content-wrapper create-new-password-page">
            <div class="card create-password-card">
                <h2>Create a new password</h2>
                <p class="instruction-text">
                    Your new password must be different from the previous number
                </p>
                <form class="new-password-form">
                    <div class="input-group password-input">
                        <input type="password" placeholder="Password" value="••••••••••">
                        <span class="material-icons visibility-toggle">visibility_off</span>
                    </div>
                    <ul class="password-requirements">
                        <li class="checked"><span class="material-icons">check_circle</span> At least 8 characters</li>
                        <li class="checked"><span class="material-icons">check_circle</span> Both upper and lower case letters</li>
                    </ul>
                    <div class="input-group password-input">
                        <input type="password" placeholder="Confirm Password" value="••••••••••">
                        <span class="material-icons visibility-toggle">visibility_off</span>
                    </div>
                    <button type="submit" class="btn primary-btn">Reset password</button>
                </form>
            </div>
        </div>

        <div class="background-shape-top-right light-purple"></div>
        <div class="background-shape-bottom-left light-beige"></div>
    </div>
</body>
</html>

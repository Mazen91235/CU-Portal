<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeOut {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .fade-out {
            animation: fadeOut 1s ease-out forwards;
        }

        .hide-content {
            display: none;
        }

        .show-content {
            display: block;
        }

        #loadingScreen img {
            object-fit: cover;
            width: 100%;
            height: 100vh;
        }

        .spinner-layer {
            object-fit: contain;
            opacity: 0.4;
            pointer-events: none;
        }

        .spin-fast {
            animation: spin 0.9s linear infinite;
        }

        .reverse-spin {
            animation-direction: reverse;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loadingScreen" class="fixed inset-0 bg-white flex items-center justify-center">
        <img src="../assets/Adobe Express - Screen Recording 2025-07-24 at 6.00.54 pm.gif" alt="Loading GIF"
            class="w-full h-full" />
    </div>


    <!-- Spinner Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-white bg-opacity-80 flex items-center justify-center z-50">
        <div class="multi-spinner relative w-32 h-32">
            <img src="../assets/Ellipse 16.svg" class="spinner-layer spin-fast  absolute inset-1 " />
            <img style=" width: 99%; height: 90%;" src="../assets/Ellipse 11.svg"
                class="spinner-layer spin-fast absolute inset-1 " />
            <img src="../assets/Ellipse 14.svg" class="spinner-layer spin-fast  absolute inset-1 " />

            <img style="width: 95%; height: 95%;" src="../assets/Ellipse 15.svg"
                class="spinner-layer spin-fast  absolute inset-1" />
            <img style="left: 0.2px; width: 98%; height: 98%;" src="../assets/Ellipse 13.svg"
                class="spinner-layer spin-fast reverse-spin absolute inset-1" />
            <img src="../assets/Ellipse 12 (1).svg" class=" spinner-layer spin-fast reverse-spin absolute inset-1 " />

            <img style=" width: 101%; height: 101%;" src="../assets/Ellipse 11.svg"
                class="spinner-layer spin-fast absolute inset-1 " />
        </div>
    </div>

    <!-- Page Content (Hidden Initially) -->
    <div id="pageContent" class="hide-content">
        <div class="min-h-screen flex items-center justify-center">
            <h1 class="text-4xl font-bold text-gray-800">hey</h1>
            <button onclick="showLoading()">Show
                Loading</button>

        </div>
    </div>

    <script>
        function hideLoadingScreen() {
            const loading = document.getElementById("loadingScreen");
            const content = document.getElementById("pageContent");

            loading.classList.add("fade-out");

            setTimeout(function () {
                loading.style.display = "none";
                content.classList.remove("hide-content");
                content.classList.add("show-content");
            }, 1000);
        }
        document.getElementById("loadingScreen").addEventListener("click", hideLoadingScreen);//just to check the function
        function showLoading() {
            document.getElementById("loadingOverlay").classList.remove("hidden");
        }

        function hideLoading() {
            document.getElementById("loadingOverlay").classList.add("hidden");
        }
        document.getElementById("loadingOverlay").addEventListener("click", hideLoading);//just to check the function

    </script>
</body>

</html>

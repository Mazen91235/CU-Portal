    <button onclick="showToast('success')">Show Success</button>
    <button onclick="showToast('warning')">Show Warning</button>
    <button onclick="showToast('error')">Show Error</button>
    <button onclick="showToast('info')">Show Info</button>


    <!-- ✅ Success Toast -->
    <div id="toast-success" class="toast toast-success hidden">
        <div class="toast-message">
            <span class="toast-icon"><img src="../assets/Icon (2).svg" alt=""></span>
            <div class="toast-content">
                <div class="toast-header">Saved Successfully</div>
                <span class="toast-text">Your changes have been saved successfully</span>
            </div>
        </div>
        <div class="toast-bar toast-success"></div>
    </div>

    <!-- ⚠️ Warning Toast -->
    <div id="toast-warning" class="toast toast-warning hidden">
        <div class="toast-message">
            <span class="toast-icon"><img src="../assets/Icon (1).svg" alt=""></span>
            <div class="toast-content">
                <div class="toast-header">Action Required</div>
                <span class="toast-text">Incomplete fields. Please fill in all required information now</span>
            </div>
        </div>
        <div class="toast-bar toast-warning"></div>
    </div>

    <!-- ❌ Error Toast -->
    <div id="toast-error" class="toast toast-error hidden">
        <div class="toast-message">
            <span class="toast-icon"><img src="../assets/Icon.svg" alt=""></span>
            <div class="toast-content">
                <div class="toast-header">Error Occurred</div>
                <span class="toast-text">Connection error. Unable to connect to the server at present</span>
            </div>
        </div>
        <div class="toast-bar toast-error"></div>
    </div>

    <!-- 💬 Info Toast -->
    <div id="toast-info" class="toast toast-info hidden">
        <div class="toast-message">
            <span class="toast-icon"><img src="../assets/iconsax-message-text.svg" alt=""></span>
            <div class="toast-content">
                <div class="toast-header">New Message</div>
                <span class="toast-text">New message waiting for you! It might be important</span>
            </div>
        </div>
        <div class="toast-bar toast-info"></div>
    </div>
    <script>
        function showToast(type) {
            const toast = document.getElementById(`toast-${type}`);
            if (!toast) return;

            // Hide all other toasts first
            document.querySelectorAll(".toast").forEach(t => {
                t.classList.add("hidden");
            });

            // Restart bar animation
            const bar = toast.querySelector(".toast-bar");
            bar.style.animation = "none"; // reset
            bar.offsetHeight; // trigger reflow
            bar.style.animation = null;

            // Show the toast
            toast.classList.remove("hidden");

            // Auto-hide after 3 seconds
            setTimeout(() => {
                toast.classList.add("hidden");
            }, 2000);
        }


    </script>
</body>

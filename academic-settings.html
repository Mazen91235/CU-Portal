<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Academic Settings</title>
  <link rel="stylesheet" href="./css/academic-settings.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/sidebar.css" />
</head>
<body>
      <div id="sidebar-container"></div>
    <div id="content-wrapper" class="sidebar-hidden">
        <div id="navbar-container" class="fixed-top"></div>

    <div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="card personal-details-card w-100" style="border-radius: 12px; border-style: none;">
        <div class="personal-details-header mb-4">
          <h4 class=" personal-details-title mb-0">Academic Settings</h4>
          <div class="personal-details-underline"></div>
        </div>
        <form>
          <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
              <label class="form-label personal-details-label">Faculty</label>
              <div id="faculty-select-group" style="position:relative;">
                <input type="text" class="form-control input-icon-right icon-venus-mars w-100" id="faculty_input" name="faculty_input" placeholder="Select your faculty" readonly style="background-color:#fff; cursor:pointer;">
                <ul id="faculty-dropdown" class="gender-dropdown-list">
                  <li data-value="cairo"><span>Cairo university</span></li>
                  <li data-value="alex"><span>Alexandria university</span></li>
                </ul>
                <input type="hidden" name="faculty" id="faculty_hidden">
                <span id="faculty-arrow" style="position:absolute; right:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; pointer-events:none; transition:transform 0.2s;">
                  <img src="./assets/iconsax-arrow-down-02.png" alt="arrow" style="width:100%;height:100%;display:block;transition:transform 0.2s;">
                </span>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label personal-details-label">Department</label>
              <div id="department-select-group" style="position:relative;">
                <input type="text" class="form-control input-icon-right icon-venus-mars w-100" id="department_input" name="department_input" placeholder="Select your department" readonly style="background-color:#fff; cursor:pointer;">
                <ul id="department-dropdown" class="gender-dropdown-list">
                  <li data-value="special"><span>Special education</span></li>
                  <li data-value="math"><span>Mathematics</span></li>
                </ul>
                <input type="hidden" name="department" id="department_hidden">
                <span id="department-arrow" style="position:absolute; right:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; pointer-events:none; transition:transform 0.2s;">
                  <img src="./assets/iconsax-arrow-down-02.png" alt="arrow" style="width:100%;height:100%;display:block;transition:transform 0.2s;">
                </span>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label personal-details-label">Year</label>
              <div id="year-select-group" style="position:relative;">
                <input type="text" class="form-control input-icon-right icon-venus-mars w-100" id="year_input" name="year_input" placeholder="Select your year" readonly style="background-color:#fff; cursor:pointer;">
                <ul id="year-dropdown" class="gender-dropdown-list">
                  <li data-value="prep"><span>Preparatory year</span></li>
                  <li data-value="first"><span>First year</span></li>
                  <li data-value="second"><span>Second year</span></li>
                  <li data-value="third"><span>Third year</span></li>
                  <li data-value="fourth"><span>Fourth year</span></li>
                </ul>
                <input type="hidden" name="year" id="year_hidden">
                <span id="year-arrow" style="position:absolute; right:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; pointer-events:none; transition:transform 0.2s;">
                  <img src="./assets/iconsax-arrow-down-02.png" alt="arrow" style="width:100%;height:100%;display:block;transition:transform 0.2s;">
                </span>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label personal-details-label">Study Type</label>
              <div id="studytype-select-group" style="position:relative;">
                <input type="text" class="form-control input-icon-right icon-venus-mars w-100" id="studytype_input" name="studytype_input" placeholder="Mainstream / Credit" readonly style="background-color:#fff; cursor:pointer;">
                <ul id="studytype-dropdown" class="gender-dropdown-list">
                  <li data-value="mainstream"><span>Mainstream</span></li>
                  <li data-value="credit"><span>Credit</span></li>
                </ul>
                <input type="hidden" name="studytype" id="studytype_hidden">
                <span id="studytype-arrow" style="position:absolute; right:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; pointer-events:none; transition:transform 0.2s;">
                  <img src="./assets/iconsax-arrow-down-02.png" alt="arrow" style="width:100%;height:100%;display:block;transition:transform 0.2s;">
                </span>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-purple personal-details-save" style="margin-bottom: 20px; font-size: 17px;">Save changes</button>
          </div>
        </form>
      </div>
    </div>
    <div id="toasts-container"></div>
  </div>
  <style>
    /* Custom select styles from select-list.html */
    #faculty-select-group .form-control,
    #department-select-group .form-control,
    #year-select-group .form-control,
    #studytype-select-group .form-control {
      border-radius: 12px;
      border: 1px solid #E0E0E0;
      background: #fff;
      font-size: 15px;
      color: #333;
      height: 44px;
      box-shadow: none;
      padding-left: 16px;
      padding-right: 40px;
    }
    #faculty-select-group .input-icon-right,
    #department-select-group .input-icon-right,
    #year-select-group .input-icon-right,
    #studytype-select-group .input-icon-right {
      background-position: right 1rem center  !important;
      background-size: 20px 20px !important;
      background-repeat: no-repeat !important;
      padding-right: 2.5rem !important;
    }
  
    #faculty-select-group .w-100,
    #department-select-group .w-100,
    #year-select-group .w-100,
    #studytype-select-group .w-100 {
      width: 100% !important;
    }
    .gender-dropdown-list {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      z-index: 10;
      margin: 0;
      padding: 0;
      list-style: none;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      min-width: 100%;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .gender-dropdown-list.open {
      opacity: 1;
      pointer-events: auto;
      border-radius: 12px;
      border-color: #5a0f61;
    }
    .gender-dropdown-list li {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      box-sizing: border-box;
      width: 100%;
      padding: 6px 12px;
      margin: 0;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      color: #333;
      font-weight: 500;
      letter-spacing: 0.01em;
      border-bottom: 1px solid #f0f0f0;
      background: transparent;
    }
    .gender-dropdown-list li > span {
      display: inline-block;
    }
    .gender-dropdown-list li:hover {
      background: #f3f3f3;
      color: #5a0f61;
      
    }
    .gender-dropdown-list li.active {
      color: #5a0f61;
      background: #f3f3f3;
      
    }
    .gender-dropdown-list li:last-child {
      border-bottom: none;
    }
    .btn,
.btn-purple {
  transition: transform 0.4s ease !important;
}

/* Scale up on hover */
.btn:hover,
.btn-purple:hover,
.personal-details-remove:hover,
.personal-details-save:hover,
.personal-details-google:hover {
  transform: scale(1.07) !important;
}

/* Scale down slightly on click/active */
.btn:active,
.btn-purple:active {
  transform: scale(0.96) !important;
}
.btn-purple:active {
  transform: scale(0.98) !important;
  box-shadow: 0 2px 8px 0 rgba(90, 15, 97, 0.08) !important;
}
  </style>
  <script>
    // Sidebar and navbar fetch logic
    fetch('./components/sidebar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
      });
    fetch('./components/navbar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('navbar-container').innerHTML = html;
      });
    function toggleSidebar(active) {
      const contentWrapper = document.getElementById('content-wrapper');
      if (active) {
        contentWrapper.style.marginLeft = '250px';
      } else {
        contentWrapper.style.marginLeft = '0';
      }
    }
    // Custom dropdown logic for all select groups
    function setupCustomDropdown(groupId, inputId, dropdownId, hiddenId, arrowId) {
      const input = document.getElementById(inputId);
      const dropdown = document.getElementById(dropdownId);
      const group = document.getElementById(groupId);
      const hidden = document.getElementById(hiddenId);
      const arrow = document.getElementById(arrowId).querySelector('img');
      function toggleDropdown() {
        dropdown.classList.toggle('open');
        if (dropdown.classList.contains('open')) {
          arrow.style.transform = 'rotate(180deg)';
        } else {
          arrow.style.transform = 'rotate(0deg)';
        }
      }
      function closeDropdown(e) {
        if (!group.contains(e.target)) {
          dropdown.classList.remove('open');
          arrow.style.transform = 'rotate(0deg)';
        }
      }
      input.addEventListener('click', toggleDropdown);
      dropdown.querySelectorAll('li').forEach(li => {
        li.addEventListener('click', function() {
          input.value = li.textContent;
          hidden.value = li.getAttribute('data-value');
          // Remove active from all, add to selected
          dropdown.querySelectorAll('li').forEach(item => item.classList.remove('active'));
          li.classList.add('active');
          dropdown.classList.remove('open');
          arrow.style.transform = 'rotate(0deg)';
        });
      });
      document.addEventListener('mousedown', closeDropdown);
    }
    setupCustomDropdown('faculty-select-group', 'faculty_input', 'faculty-dropdown', 'faculty_hidden', 'faculty-arrow');
    setupCustomDropdown('department-select-group', 'department_input', 'department-dropdown', 'department_hidden', 'department-arrow');
    setupCustomDropdown('year-select-group', 'year_input', 'year-dropdown', 'year_hidden', 'year-arrow');
    setupCustomDropdown('studytype-select-group', 'studytype_input', 'studytype-dropdown', 'studytype_hidden', 'studytype-arrow');
  </script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script src="./js/loading.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script src="./js/loading.js"></script>
</body>
</html>

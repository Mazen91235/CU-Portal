<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="./css/calendercss.css" />
    <link rel="stylesheet" href="./css/sidebar.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <script src="./js/loading.js"></script>
    <script src="./js/sidebar.js"></script>
    <title>Calender</title>
</head>
<body>
<!-- Navbar -->
<div id="navbar-container"></div>
<!-- Sidebar -->
<div id="sidebar-container"></div>

<!-- Main content -->
<div class="container mt-5" id="calendar-main">
    <!-- Moved header and subtitle outside the card -->
    <h2 class="calendar-title text-center mb-3">Student Calendar</h2>
    <p class="calendar-subtitle text-center mb-4">Keep track of your academic schedule</p>
    <div class="card calendar-card p-4 mb-4">
        <!-- Calendar Section -->
        <div id="calendar-section-wrapper" class="calendar-section-wrapper">
            <div id="calendar-section"></div>
        </div>
        <!-- Legend -->
        <div class="d-flex justify-content-left gap-4 mt-3">
            <span><span class="event-dot event-dot-exam"></span> Exams</span>
            <span><span class="event-dot event-dot-assignment"></span> Assignments</span>
            <span><span class="event-dot event-dot-event"></span> Events</span>
        </div>
    </div>
    <!-- Details Section -->
    <div id="details-section"></div>
</div>

<script>
// Dynamically load navbar and sidebar components with error handling
document.addEventListener("DOMContentLoaded", function() {
    fetch('./components/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-container').innerHTML = data;
        })
        .catch(err => console.error('Navbar load error:', err));

    fetch('./components/sidebar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('sidebar-container').innerHTML = data;
            // Initialize sidebar toggle logic after sidebar is loaded
            if (typeof initSidebar === 'function') {
                initSidebar();
            }
        })
        .catch(err => {
            console.error('Sidebar load error:', err);
            document.getElementById('sidebar-container').innerHTML = '<div style="color:red;">Sidebar failed to load.</div>';
        });

    // --- Calendar & Details Logic ---
    const eventData = {
        // Format: 'YYYY-MM-DD': [ {type, title, ...}, ... ]
        "2025-07-15": [
            { type: "assignment", title: "Math Assignment", status: "Active", due: "23:59", location: "Online Submission", prof: "Prof. Johnson" }
        ],
        "2025-07-18": [
            { type: "exam", title: "Physics Midterm", status: "Due", time: "14:00 - 16:00", location: "Main Hall B-201", prof: "Dr. Wilson" }
        ],
        "2025-07-22": [
            { type: "event", title: "Physics Lab", time: "09:00 - 11:00", location: "Lab Building A-102", prof: "Dr. Smith" },
            { type: "assignment", title: "Mathematics Assignment", status: "Active", due: "23:59", location: "Online Submission", prof: "Prof. Johnson" },
            { type: "exam", title: "Chemistry Midterm", status: "Due", time: "14:00 - 16:00", location: "Main Hall B-201", prof: "Dr. Wilson" }
        ],
        "2025-07-25": [
            { type: "event", title: "Physics Lab", time: "09:00 - 11:00", location: "Lab Building A-102", prof: "Dr. Smith" },
            { type: "assignment", title: "Mathematics Assignment", status: "Active", due: "23:59", location: "Online Submission", prof: "Prof. Johnson" },
            { type: "exam", title: "Chemistry Midterm", status: "Due", time: "14:00 - 16:00", location: "Main Hall B-201", prof: "Dr. Wilson" }
        ]
    };

    const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    let selectedDate = null;
    let currentMonth = 6; // July (0-based)
    let currentYear = 2025;

    // Select today's date if in current month/year
    const today = new Date();
    if (today.getFullYear() === currentYear && today.getMonth() === currentMonth) {
        selectedDate = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    }

    function renderCalendar(year, month) {
        const today = new Date();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startDay = firstDay.getDay(); // 0=Sun
        const daysInMonth = lastDay.getDate();

        let html = `
            <div class="calendar-nav d-flex justify-content-center align-items-center mb-3">
                <button class="calendar-nav-btn" id="prev-month"><i class="fa fa-chevron-left"></i></button>
                <span class="calendar-nav-label mx-3">${monthNames[month]} ${year}</span>
                <button class="calendar-nav-btn" id="next-month"><i class="fa fa-chevron-right"></i></button>
            </div>
            <div class="calendar-table-outer">
            <table class="table table-borderless text-center mb-0 calendar-table">
                <thead>
                    <tr>
                        <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th>
                        <th>Thu</th><th>Fri</th><th>Sat</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let day = 1;
        for (let i = 0; i < 6; i++) {
            html += '<tr class="calendar-row-gap">';
            for (let j = 0; j < 7; j++) {
                if ((i === 0 && j < startDay) || day > daysInMonth) {
                    html += "<td></td>";
                } else {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                    const events = eventData[dateStr] || [];
                    let dots = "";
                    if (events.length) {
                        // Show up to 3 dots, one per type
                        const types = {};
                        events.forEach(ev => types[ev.type] = true);
                        if (types.assignment) dots += '<span class="event-dot event-dot-assignment"></span>';
                        if (types.event) dots += '<span class="event-dot event-dot-event"></span>';
                        if (types.exam) dots += '<span class="event-dot event-dot-exam"></span>';
                    }
                    const isSelected = selectedDate === dateStr;
                    html += `<td>
                        <button class="calendar-day-btn${isSelected ? ' selected' : ''}" data-date="${dateStr}">
                            <span class="calendar-day-number">${day}</span>
                            <div class="calendar-day-dots">${dots}</div>
                        </button>
                    </td>`;
                    day++;
                }
            }
            html += "</tr>";
            if (day > daysInMonth) break;
        }
        html += "</tbody></table></div>";
        document.getElementById("calendar-section").innerHTML = html;

        // Month navigation
        document.getElementById("prev-month").onclick = () => {
            if (currentMonth === 0) {
                currentMonth = 11;
                currentYear--;
            } else {
                currentMonth--;
            }
            selectedDate = null;
            renderCalendar(currentYear, currentMonth);
            renderDetails();
        };
        document.getElementById("next-month").onclick = () => {
            if (currentMonth === 11) {
                currentMonth = 0;
                currentYear++;
            } else {
                currentMonth++;
            }
            selectedDate = null;
            renderCalendar(currentYear, currentMonth);
            renderDetails();
        };

        // Day selection
        document.querySelectorAll(".calendar-day-btn").forEach(btn => {
            btn.onclick = () => {
                selectedDate = btn.getAttribute("data-date");
                renderCalendar(currentYear, currentMonth);
                renderDetails();
            };
        });
    }

    function renderDetails() {
        const details = document.getElementById("details-section");
        let imgSrc = "assets/select.jpg";
        let imgAlt = "select";
        let title = "";
        let desc = "";
        let eventList = "";
        let content = "";

        if (!selectedDate) {
            // No day selected
            title = "Select a day to see what's happening 🚀";
            desc = "Click on any date to view your events, assignments, and exams";
            content = `
                <div class="card p-4 text-center" style="background:#fff;border:none;box-shadow:0 2px 16px 0 rgba(44,44,44,0.08);">
                    <div class="details-img-wrapper mb-3" style="justify-content:center;">
                        <img src="${imgSrc}" alt="${imgAlt}" class="details-img" style="width:192px;height:192px;">
                    </div>
                    <h5 class="mb-2">${title}</h5>
                    <p class="mb-3" style="color:#888;">${desc}</p>
                </div>
            `;
        } else {
            const events = eventData[selectedDate] || [];
            const dateObj = new Date(selectedDate);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = dateObj.toLocaleDateString(undefined, options);

            if (!events.length) {
                // No events for selected day
                imgSrc = "assets/nothing.jpg";
                imgAlt = "nothing";
                title = `Nothing scheduled for ${dateStr}`;
                desc = "You're all clear. Enjoy your day off! 🎉";
                content = `
                    <div class="card p-4 text-center" style="background:#fff;border:none;box-shadow:0 2px 16px 0 rgba(44,44,44,0.08);">
                        <div class="details-img-wrapper mb-3" style="justify-content:center;">
                            <img src="${imgSrc}" alt="${imgAlt}" class="details-img" style="width:192px;height:192px;">
                        </div>
                        <h5 class="mb-2">${title}</h5>
                        <p class="mb-3" style="color:#888;">${desc}</p>
                    </div>
                `;
            } else {
                // Events for selected day
                imgSrc = ""; // No image, use icon
                imgAlt = "calendar";
                title = dateStr;
                eventList = events.map(ev => {
                    if (ev.type === "event") {
                        return `
                            <div class="event-detail-card mb-3">
                                <div class="fw-semibold">${ev.title} <span class="badge badge-event ms-1">Event</span></div>
                                <div class="small text-muted mt-1"><i class="far fa-clock me-1"></i>${ev.time || ""} <i class="fa-solid fa-location-dot ms-2 me-1"></i>${ev.location || ""}</div>
                                <div class="small mt-1">${ev.prof || ""}</div>
                                <button class="btn btn-view btn-event"><i class="far fa-eye me-1"></i>View Event</button>
                            </div>
                        `;
                    }
                    if (ev.type === "assignment") {
                        return `
                            <div class="event-detail-card mb-3">
                                <div class="fw-semibold">${ev.title} 
                                    <span class="badge badge-assignment ms-1">Assignment</span>
                                    <span class="badge badge-active ms-1">${ev.status}</span>
                                </div>
                                <div class="small text-muted mt-1"><i class="far fa-clock me-1"></i>${ev.due ? "Due: " + ev.due : ""} <i class="fa-solid fa-location-dot ms-2 me-1"></i>${ev.location || ""}</div>
                                <div class="small mt-1">${ev.prof || ""}</div>
                                <button class="btn btn-view btn-assignment"><i class="far fa-eye me-1"></i>View Assignment</button>
                            </div>
                        `;
                    }
                    if (ev.type === "exam") {
                        return `
                            <div class="event-detail-card mb-3">
                                <div class="fw-semibold">${ev.title} 
                                    <span class="badge badge-exam ms-1">Exam</span>
                                    <span class="badge badge-due ms-1">${ev.status}</span>
                                </div>
                                <div class="small text-muted mt-1"><i class="far fa-clock me-1"></i>${ev.time || ""} <i class="fa-solid fa-location-dot ms-2 me-1"></i>${ev.location || ""}</div>
                                <div class="small mt-1">${ev.prof || ""}</div>
                                <button class="btn btn-view btn-exam"><i class="far fa-eye me-1"></i>View Exam</button>
                            </div>
                        `;
                    }
                    return "";
                }).join("");
                content = `
                    <div class="event-details-card card p-4" style="background:#fff;border:none;box-shadow:0 2px 16px 0 rgba(44,44,44,0.08);">
                        <div class="d-flex align-items-center mb-4" style="gap:16px;">
                            <i class="far fa-calendar"></i>
                            <span style="color:rgba(54, 61, 73, 1);font-size:1.1rem;font-weight:600;vertical-align:middle;">${title}</span>
                        </div>
                        ${eventList}
                    </div>
                `;
            }
        }

        details.innerHTML = content;
    }

    renderCalendar(currentYear, currentMonth);
    renderDetails();
});
</script>
</body>
</html>

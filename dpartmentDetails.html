<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>title</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="./css/sidebar.css" />

    <link rel="stylesheet" href="./css/departmentDetails.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>


</head>

<body>
    <div id="sidebar-container"></div>

    <!-- Content wrapper: navbar + main content -->
    <div id="content-wrapper" class="sidebar-hidden">

        <div id="navbar-container" class="fixed-top" style="z-index: 4;"></div>
        <div id="main-content" class="p-4 mt-5">

            <!-- Header Card -->
            <div class="bg-white rounded-xl shadow-sm p-6 flex justify-between items-start" style="height: auto;">
                <div>
                    <div class="flex items-center gap-2">
                        <img class="me-1" style="width: 40px; height: 40px;" src="./assets/Group (1) copy 2.svg">
                        <h1 style="color: #5A0F61; font-size: 28px;"> Computer Department</h1>
                        <span class=" text-xs px-3 py-1 rounded-full font-medium"

                    <p class="text-gray-500 mt-1">Faculty Of Engineering</p>
                </div>
                <i style="cursor: pointer;" class="fas fa-ellipsis-v text-purple-700"></i>
            </div>

            <!-- Overview Title -->
            <div class="mt-6 mb-4">

;">
                    Overview And Statistics
                </h2>
            </div>

            <!-- Stats Grid -->
            <div class="row gap-6 mt-6 justify-content-center ">

                    <div class="bg-purple-100 text-purple-700 p-3 rounded-full flex-shrink-0 ">
                        <img src="./assets/profile-2user.svg" alt="Users" class="w-6 h-6" />
                    </div>

                    <div class="ml-4">
                        <h3 class="text-gray-500 text-sm">Total Users</h3>
                        <p class="text-2xl font-bold text-gray-800" id="users">2,550</p>
                        <a href="#" class="text-green-600 text-sm font-semibold mt-1 inline-block underline">Go
                            To</a>
                    </div>
                </div>


                <div class=" col-4  stat bg-white rounded-lg shadow-sm px-5 py-4 flex items-center">
                    <div class="bg-purple-100 text-purple-700 p-3 rounded-full flex-shrink-0 ">
                        <img src="./assets/Document.svg" class="w-6 h-6">
                    </div>
                    <div class="ml-4">

                        <h3 class="text-gray-500 text-sm">Total Subjects</h3>
                        <p class="text-2xl font-bold text-gray-800" id="subjects">14</p>
                        <a href="#" class="text-green-600 text-sm font-semibold mt-1 inline-block underline">Go
                            To</a>
                    </div>
                </div>
                <div class="col-4 stat bg-white rounded-lg shadow-sm px-5 py-4 flex items-center">
                    <div class="bg-purple-100 text-purple-700 p-3 rounded-full flex-shrink-0 ">
                        <img src="./assets/clipboard-tick 1.svg" class="w-6 h-6">
                    </div>
                    <div class="ml-4">

                        <h3 class="text-gray-500 text-sm">Total Tasks</h3>
                        <p class="text-2xl font-bold text-gray-800" id="tasks">50</p>
                        <a href="#" class="text-green-600 text-sm font-semibold mt-1 inline-block underline">Go
                            To</a>
                    </div>
                </div>
                <div class="col-4 stat bg-white rounded-lg shadow-sm px-5 py-4 flex items-center">
                    <div class="bg-purple-100 text-purple-700 p-3 rounded-full flex-shrink-0 ">
                        <img src="./assets/Book copy.svg" class="w-6 h-6">
                    </div>
                    <div class="ml-4">

                        <h3 class="text-gray-500 text-sm">Total Exams</h3>
                        <p class="text-2xl font-bold text-gray-800" id="exams">14</p>
                        <a href="#" class="text-green-600 text-sm font-semibold mt-1 inline-block underline ">Go
                            To</a>
                    </div>
                </div>

                <div class="col-4 stat bg-white rounded-lg shadow-sm px-5 py-4 flex items-center">
                    <div class="bg-purple-100 text-purple-700 p-3 rounded-full flex-shrink-0 ">
                        <img src="./assets/Smartphone 2.svg" class="w-6 h-6">
                    </div>
                    <div class="ml-4">

                        <h3 class="text-gray-500 text-sm">Total Announcements</h3>
                        <p class="text-2xl font-bold text-gray-800" id="Announcements">80</p>
                        <a href="#" class="text-green-600 text-sm font-semibold mt-1 inline-block underline">Go
                            To</a>
                    </div>
                </div>

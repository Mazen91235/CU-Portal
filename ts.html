<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />


  <link rel="stylesheet" href="./css/sidebar.css" />




</head>

<body>
  <div id="sidebar-container"></div>

  <!-- Content wrapper: navbar + main content -->
  <div id="content-wrapper" class="sidebar-hidden">

    <div id="navbar-container" class="fixed-top" style="z-index: 4;"></div>
    <div id="main-content" class="p-4 mt-5">
      <div id="loadingScreenContainer" class="w-full h-full"
        style="width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 50;"></div>
      <div id="loadingOverlayContainer" class="d-none w-full h-full"
        style="width: 100vw; height: 100vh; top: 0; left: 0; z-index: 50;"></div>
      <div id="popup-container"></div>
      <div id="toast-container"></div>

  <div class="menu-dots">
  <i class="fas fa-ellipsis-v dep-menu" data-idx="${idx}"></i>
  <div class="dep-dropdown hidden">
    <div class="dep-dropdown-item edit-dep" data-idx="${idx}">Edit</div>
    <div class="dep-dropdown-item delete-dep" data-idx="${idx}">Delete</div>
  </div>
</div>

      <h1>Welcome</h1>
      <button onclick="showLoading()">Show Spinner</button>
      <button id="testPopupBtn">triggerSuccess</button>
      <button id="showToastBtn">Show Success Toast</button>
    </div>
  </div>
  <script src="./js/loading.js"></script>

  <script src="./js/toast.js"></script>

  <script src="./js/loadscreen.js"></script>
  <script src="./js/popup.js"></script>



  <script>

  </script>

</body>

</html>

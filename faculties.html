    <style>
      /* Responsive popup overlay/modal */
      .popup-overlay {
        position: fixed;
        z-index: 2000;
        left: 0; top: 0; right: 0; bottom: 0;
        background: rgba(60,60,60,0.6);
        display: none;
        align-items: center;
        justify-content: center;
      }
      .popup-modal {
        background: #fff;
        border-radius: 22px;
        padding: 32px 28px 28px 28px;
        min-width: 320px;
        max-width: 95vw;
        width: 100%;
        max-height: 90vh;
        box-shadow: 0 4px 32px rgba(0,0,0,0.12);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .popup-title {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 2rem;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #ff7ecb 0%, #7d26c9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .popup-input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #d09adf;
        border-radius: 8px;
        font-size: 1.1rem;
        outline: none;
        transition: border 0.2s;
        margin-bottom: 0;
      }
      .popup-input:focus {
        border-color: #7d26c9;
      }
      .popup-btn {
        width: 100%;
        background: #7d26c9;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 0;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 0;
        transition: background 0.2s;
      }
      .popup-btn:hover {
        background: #a14fdc;
      }
      @media (max-width: 600px) {
        .popup-modal {
          min-width: 0;
          width: 95vw;
          padding: 18px 8px 18px 8px;
          border-radius: 14px;
        }
        .popup-title {
          font-size: 1.3rem;
        }
        .popup-input, .popup-btn {
          font-size: 1rem;
          padding: 10px 8px;
        }
      }
      /* Optional: allow scrolling if popup content is too tall */
      .popup-overlay {
        overflow-y: auto;
      }
      .popup-modal {
        margin: 32px 0;
      }
    </style>
</head>

    <script src="./js/loading.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
  // Simple search filter for faculty cards
  document.querySelector('.search-input').addEventListener('input', function(e) {
    const query = e.target.value.toLowerCase();
    document.querySelectorAll('.faculty-card').forEach(card => {
      const name = card.querySelector('.faculty-name').textContent.toLowerCase();
      card.parentElement.style.display = name.includes(query) ? '' : 'none';
    });
  });

  // Popup logic
  function showPopup(overlayId, inputId, initialValue = '') {
    document.getElementById('content-wrapper').classList.add('blurred');
    const overlay = document.getElementById(overlayId);
    overlay.style.display = 'flex';
    const input = document.getElementById(inputId);
    input.value = initialValue;
    setTimeout(() => input.focus(), 100);
  }
  function hidePopups() {
    document.getElementById('content-wrapper').classList.remove('blurred');
    document.getElementById('addFacultyOverlay').style.display = 'none';
    document.getElementById('editFacultyOverlay').style.display = 'none';
  }

  // Track the card being edited
  let editingCard = null;

  // Show Add Faculty popup
  document.querySelectorAll('.add-years-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      showPopup('addFacultyOverlay', 'addFacultyInput');
    });
  });

  // Show Edit Faculty popup (event delegation for dynamic support)
  document.querySelector('.row.g-4').addEventListener('click', function(e) {
    const editBtn = e.target.closest('.edit-btn');
    if (editBtn) {
      const card = editBtn.closest('.faculty-card');
      const facultyName = card.querySelector('.faculty-name').textContent.trim();
      editingCard = card;
      showPopup('editFacultyOverlay', 'editFacultyInput', facultyName);
    }
    const deleteBtn = e.target.closest('.delete-btn');
    if (deleteBtn) {
      const cardCol = deleteBtn.closest('.col-lg-4, .col-md-6, .col-12');
      if (cardCol) cardCol.remove();
    }
  });

  // Hide popup when clicking outside modal or pressing Escape
  document.querySelectorAll('.popup-overlay').forEach(overlay => {
    overlay.addEventListener('mousedown', function(e) {
      if (e.target === overlay) hidePopups();
    });
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hidePopups();
  });

  // Add faculty card logic
  document.getElementById('addFacultyBtn').onclick = function(e) {
    e.preventDefault();
    const name = document.getElementById('addFacultyInput').value.trim();
    if (name) {
      // Create card HTML
      const card = document.createElement('div');
      card.className = 'col-lg-4 col-md-6 col-12';
      card.innerHTML = `
        <div class="faculty-card">
          <div class="faculty-logo-circle default-bg">
            <img src="./assets/university.png" alt="University Logo">
          </div>
          <h2 class="faculty-name">${name}</h2>
          <div class="faculty-actions">
            <button class="btn edit-btn">Edit</button>
            <button class="btn delete-btn">Delete</button>
          </div>
        </div>
      `;
      document.querySelector('.row.g-4').appendChild(card);
      // No need to add event listeners, event delegation handles it
    }
    hidePopups();
  };

  // Edit faculty card logic
  document.getElementById('editFacultyBtn').onclick = function(e) {
    e.preventDefault();
    const newName = document.getElementById('editFacultyInput').value.trim();
    if (editingCard && newName) {
      editingCard.querySelector('.faculty-name').textContent = newName;
    }
    hidePopups();
  };
});
</script>

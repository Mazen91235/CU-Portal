    <!-- Add Faculty Popup -->
    <div class="popup-overlay" id="addFacultyOverlay" style="display:none;">
      <div class="popup-modal">
        <h2 class="popup-title">Add A New Faculty</h2>
        <input type="text" class="popup-input" id="addFacultyInput" placeholder="Faculty name..." />
        <button class="popup-btn" id="addFacultyBtn">Add faculty</button>
      </div>
    </div>
    <!-- Edit Faculty Popup -->
    <div class="popup-overlay" id="editFacultyOverlay" style="display:none;">
      <div class="popup-modal">
        <h2 class="popup-title">Edit Faculty</h2>
        <input type="text" class="popup-input" id="editFacultyInput" placeholder="Faculty name..." />
        <button class="popup-btn" id="editFacultyBtn">Edit faculty</button>
      </div>
    </div>
    <script src="./js/loading.js"></script>
    <script>
        // Simple search filter for faculty cards
        document.querySelector('.search-input').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.faculty-card').forEach(card => {
                const name = card.querySelector('.faculty-name').textContent.toLowerCase();
                card.parentElement.style.display = name.includes(query) ? '' : 'none';
            });
        });
        // Popup logic
        function showPopup(overlayId, inputId, initialValue = '') {
          // Removed blur effect
          document.getElementById(overlayId).style.display = 'flex';
          const input = document.getElementById(inputId);
          input.value = initialValue;
          setTimeout(() => input.focus(), 100);
        }
        function hidePopups() {
          // Removed blur effect
          document.getElementById('addFacultyOverlay').style.display = 'none';
          document.getElementById('editFacultyOverlay').style.display = 'none';
        }

        // Track the card being edited
        let editingCard = null;

        // Show Add Faculty popup
  document.querySelectorAll('.add-years-btn, .add-years-btn-mobile, .add-years-btn-desktop').forEach(btn => {
          btn.addEventListener('click', function() {
            showPopup('addFacultyOverlay', 'addFacultyInput');
          });
        });

        // Show Edit Faculty popup
        document.querySelectorAll('.faculty-card .edit-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const card = btn.closest('.faculty-card');
            const facultyName = card.querySelector('.faculty-name').textContent.trim();
            editingCard = card;
            showPopup('editFacultyOverlay', 'editFacultyInput', facultyName);
          });
        });

        // Delete Faculty logic for initial cards
        document.querySelectorAll('.faculty-card .delete-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const cardCol = btn.closest('.col-lg-4, .col-md-6, .col-12');
            const facultyName = btn.closest('.faculty-card').querySelector('.faculty-name').textContent.trim();
            if (cardCol && confirm(`Are you sure you want to delete "${facultyName}"?`)) cardCol.remove();
          });
        });

        // Hide popup when clicking outside modal or pressing Escape
        document.querySelectorAll('.popup-overlay').forEach(overlay => {
          overlay.addEventListener('mousedown', function(e) {
            if (e.target === overlay) hidePopups();
          });
        });
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') hidePopups();
        });

        // Add faculty card logic
        document.getElementById('addFacultyBtn').onclick = function(e) {
          e.preventDefault();
          const name = document.getElementById('addFacultyInput').value.trim();
          if (name) {
            // Create card HTML
            const card = document.createElement('div');
            card.className = 'col-lg-4 col-md-6 col-12';
            card.innerHTML = `
              <div class="faculty-card">
                <div class="faculty-logo-circle default-bg">
                  <img src="./assets/university.png" alt="University Logo">
                </div>
                <h2 class="faculty-name">${name}</h2>
                <div class="faculty-actions">
                  <button class="btn edit-btn">Edit</button>
                  <button class="btn delete-btn">Delete</button>
                </div>
              </div>
            `;
            document.querySelector('.row.g-4').appendChild(card);
            // Add edit event for new card
            card.querySelector('.edit-btn').addEventListener('click', function() {
              editingCard = card.querySelector('.faculty-card');
              const facultyName = editingCard.querySelector('.faculty-name').textContent.trim();
              showPopup('editFacultyOverlay', 'editFacultyInput', facultyName);
            });
            // Add delete event for new card (with confirmation)
            card.querySelector('.delete-btn').addEventListener('click', function() {
              const facultyName = card.querySelector('.faculty-name').textContent.trim();
              if (confirm(`Are you sure you want to delete "${facultyName}"?`)) card.remove();
            });
          }
          hidePopups();
        };

        // Edit faculty card logic
        document.getElementById('editFacultyBtn').onclick = function(e) {
          e.preventDefault();
          const newName = document.getElementById('editFacultyInput').value.trim();
          if (editingCard && newName) {
            editingCard.querySelector('.faculty-name').textContent = newName;
          }
          hidePopups();
        };

        // Fix: force sidebar to not block pointer events for add button
    function bringAddButtonToFront() {
      var btn = document.querySelector('.add-years-btn-mobile');
      if (btn) {
        btn.style.position = 'relative';
        btn.style.zIndex = '1100';
        btn.style.pointerEvents = 'auto';
      }
    }
    // Call on load and on sidebar toggle (if you have sidebar toggling)
    document.addEventListener('DOMContentLoaded', bringAddButtonToFront);
    // If you have a sidebar toggle, call bringAddButtonToFront() after toggling
    </script>

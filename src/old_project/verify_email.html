    await fetchUserEmail();
  });
// Auto-focus next input on entry for code boxes
const codeInputs = document.querySelectorAll('.welcome-card2 input[type="text"]');
codeInputs.forEach((input, idx) => {
  input.addEventListener('input', function(e) {
    if (input.value.length === 1 && idx < codeInputs.length - 1) {
      codeInputs[idx + 1].focus();
    }
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && input.value === '' && idx > 0) {
      codeInputs[idx - 1].focus();
    }
    if(e.key === 'ArrowLeft' && idx > 0) {
      codeInputs[idx - 1].focus();
    }
    if(e.key === 'ArrowRight' && idx < codeInputs.length - 1) {
      codeInputs[idx + 1].focus();
    }
    if(e.key === 'Enter') {
      document.querySelector('.vertify-btn').click();
    }
  });
});
</script>

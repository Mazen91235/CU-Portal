<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Create Profile</title>

    <link rel="stylesheet" href="../css/creatprofilestyle.css">
      <link rel="stylesheet" href="../css/sidebar.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/all.min-new.css">
<style>
.custom-filter-label-value { display: flex; flex-direction: column; margin-left: 30px; margin-top: 4px; flex: 1 1 0; min-width: 0; }
.custom-filter-label { color: #64748B; font-size: 13px; font-weight: 400; margin-bottom: 0.5px; text-align: left; letter-spacing: 0.01em; }
.custom-filter-value { color: #22223B; font-size: 13px; font-weight: 500; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.custom-filter { display: flex; align-items: center; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; height: 48px; cursor: pointer; padding: 0 16px 0 0; min-width: 180px; box-shadow: 0 2px 8px rgba(80, 14, 88, 0.04); position: relative; z-index: 999; transition: box-shadow 0.15s, border-color 0.15s; }
.custom-filter:hover, .custom-filter.open { border-color: #7B1684 !important; box-shadow: 0 0 0 2px #7B168433; }
.custom-filter-arrow { margin-left: 16px; margin-right: 8px; transition: transform 0.2s; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
.custom-filter.open .custom-filter-arrow { transform: rotate(180deg); }
.custom-dropdown-list {
  position: absolute;
  left: 0;
  top: 100%;
  width: 100%;
  background: #fff;
  border: 1px solid #7B1684;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(80, 14, 88, 0.08);
  z-index: 9999;
  margin-top: 4px;
  padding: 0;
  list-style: none;
  display: none;       /* hidden by default */
  max-height: 220px;
  overflow-y: auto;
  font-size: 16px;
}

.custom-dropdown-list.active {
  display: block;      /* show when active */
}

.custom-dropdown-list li {
  padding: 14px;
  margin: 0;
  cursor: pointer;
  color: #374151;
  transition: background 0.15s, color 0.15s;
}

.custom-dropdown-list li:hover,
.custom-dropdown-list li.active {
  background: #f3f3f3;
  color: #7B1684;
  font-weight: 500;
}
.drag-over{
    border: 2px dashed #7B1684 !important;
    background-color: #f9f5fb;
}
</style>
</head>
<body>
    <div class="container">
        <img src="../assets/freepik--background-simple--inject-251.png" alt="" class="corner-image-top-right">
        <img src="../assets/freepik--background-simple--inject-251 (1).png" alt="" class="corner-image-bottom-left">
        <header class="header">
            <h1 class="logo">St<span class="highlight">u</span>dent P<span class="highlight">o</span>rtal</h1>
        </header>

        <div class="content-wrapper create-profile-page">
            <div class="illustration">
                <img src="../assets/7de525c83cdb32bf7fac2a99588c4cefe7a08a01.png" alt="Student writing illustration">
            </div>
            <div class="card profile-form-card">
                <img src="../assets/7de525c83cdb32bf7fac2a99588c4cefe7a08a01.png" id="illustration_img" alt="Student writing illustration">
                <h2 class="gradient-text-h2">create your profile</h2>
                <p class="subtitle">Don't miss out! Create your profile in minutes</p>

                <form class="profile-form" onsubmit="Signup(this);">
                    <div class="input-row">
                        <div class="input-group">
                            <span class="material-icons icon-prefix">person</span>
                            <input type="text" name="name" placeholder="Name">
                        </div>
                        <div class="input-group">
                            <span class="material-icons icon-prefix">email</span>
                            <input type="email" name="email" placeholder="yourname@stud.cu.edu.eg">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <span class="material-icons icon-prefix">phone</span>
                            <input type="tel" name="phone" placeholder="Phone Number">
                        </div>
                        <div class="input-group">
                            <span class="material-icons icon-prefix">fingerprint</span>
                            <input type="text" name="national_id" placeholder="National ID">
                        </div>
                    </div>
                    <div class="input-row">
                       <!-- Gender dropdown -->
<div class="input-group select-group" style="position:relative; width:100%;" id="gender-select-group">
  <span class="material-icons icon-prefix" style="cursor: pointer;">wc</span>
  <input type="text" name="gender_input" id="gender_input" placeholder="Gender" readonly>
  <ul class="custom-dropdown-list" id="customGenderDropdown">
    <li class="active" data-value="gender">Gender</li>
    <li data-value="male">Male</li>
    <li data-value="female">Female</li>
  </ul>
  <select name="gender" id="gender" style="display: none;">
    <option value="gender">Gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>
  <i class="fa-solid fa-caret-down" style="color: var(--medium-grey);"></i>
</div>

                        <div class="input-group file-input-group">
                            <span class="material-icons icon-prefix">attach_file</span>
                            <input type="file" name="file" id="file" class="hidden-file-input">
                            <!-- <label for="file" class="file-label">University ID Or Photo Of Approval</label> -->
                            <input type="text" placeholder="University ID or Photo of Approval" id="university_id" readonly>
                            <label class="attachment-info-text" style="position: absolute;top: -15px;left: 5px;">Only needed if the email you entered isn't The University Email</label>
                        </div>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="agreed">
                        <label for="terms">agree to <a href="terms_of_service.html">our terms</a>  & <a href="privacy_policy.html">privacy policy</a> </label>
                    </div>
                    <div class="checkbox-group">
                    <input type="checkbox" id="subscription" name="early_access">
                    <label for="subscription">Register in <b>Early Access Membership</b> to try New Features before anyone else</label>
                    </div>
                    <button type="submit" class="btn primary-btn">Create Profile Now!</button>
                </form>
            </div>
        </div>
      <div id="toast-container"></div>
 <div id="loadingOverlayContainer" class="d-none w-full h-full"
        style="width: 100vw; height: 100vh; top: 0; left: 0; position: fixed;z-index: 999999999999;;"></div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"></script>
        <script src="/js/script.js"></script>
            <script src="/js/toast.js"></script>
              <script src="../js/loadscreen.js"></script>

  <script>
document.querySelector('.file-input-group #university_id').onclick = () => {
    document.getElementById('file').click();
};
document.getElementById('file').addEventListener('change', function(e) {
    const fileName = e.target.files[0] ? e.target.files[0].name : 'University ID or Photo of Approval';
    const fileSize = e.target.files[0] ? `(${(e.target.files[0].size / (1024 * 1024)).toFixed(2)} MB)` : '';
    document.querySelector('#university_id').setAttribute('placeholder', `${fileName} ${fileSize}`);
});

// ===================
// Gender dropdown fix
// ===================
const genderInput = document.getElementById('gender_input');
const genderDropdown = document.getElementById('customGenderDropdown');
const genderSelect = document.getElementById('gender');
const caretIcon = document.querySelector('.select-group i');
const genderSelectGroup = document.getElementById('gender-select-group');

// Open dropdown when clicking anywhere inside the select-group
genderSelectGroup.addEventListener('click', (e) => {
    genderDropdown.classList.toggle('active');
    caretIcon.classList.toggle('fa-caret-up');
    caretIcon.classList.toggle('fa-caret-down');
});

// Prevent input click handler from duplicating logic
genderInput.onclick = null;

// Handle item selection
genderDropdown.querySelectorAll('li').forEach(item => {
    item.addEventListener('click', (e) => {
        e.stopPropagation();
        genderDropdown.querySelector('.active')?.classList.remove('active');
        item.classList.add('active');
        genderInput.value = item.textContent;
        genderSelect.value = item.getAttribute('data-value');
        genderDropdown.classList.remove('active');
        caretIcon.classList.add('fa-caret-down');
        caretIcon.classList.remove('fa-caret-up');
    });
});

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
    if (!genderSelectGroup.contains(e.target)) {
        genderDropdown.classList.remove('active');
        caretIcon.classList.add('fa-caret-down');
        caretIcon.classList.remove('fa-caret-up');
    }
});

// ===================
// Page load logic
// ===================
window.onload = async function () {
    // Default select "Gender"
    genderDropdown.querySelectorAll('li')[0].click();

    if (await IsLoggedIn()) {
        window.location.href = "/user/index.html";
        return;
    }
    if (GetParams("error") == "true") {
        showToast("error", GetParams("message"));
    }
    if (GetParams("success") == "true") {
        showToast("success", GetParams("message"));
    }

    if (!await GetGoogleAccessToken) {
        window.location.href = "/login.html";
        SetCookie("error", "Please Authorize Google Account First to Proceed.", 1);
        return;
    }
};
document.querySelector(".file-input-group").addEventListener("dragover", function(e) {
    e.preventDefault();
    e.stopPropagation();
    document.querySelector(".file-input-group").classList.add("drag-over");
});
document.querySelector(".file-input-group").addEventListener("dragleave", function(e) {
    e.preventDefault();
    e.stopPropagation();
    document.querySelector(".file-input-group").classList.remove("drag-over");
});

document.querySelector(".file-input-group").addEventListener("drop", function(e) {
    e.preventDefault();
    e.stopPropagation();
    if(!e.dataTransfer.files || e.dataTransfer.files.length == 0) {
        document.querySelector(".file-input-group").classList.remove("drag-over");
        return;
    }
    if(e.dataTransfer.files[0].type && !e.dataTransfer.files[0].type.startsWith("image/")) {
        showToast("error", "Error", "Only image files are allowed");
        document.querySelector(".file-input-group").classList.remove("drag-over");
        return;
    }
    if(e.dataTransfer.files[0].size > 10 * 1024 * 1024) {
        showToast("error", "Error", "File size must be less than 10MB");
        document.querySelector(".file-input-group").classList.remove("drag-over");
        return;
    }
    if(e.dataTransfer.files.length > 1) {
        showToast("error", "Error", "Please upload only one file");
        document.querySelector(".file-input-group").classList.remove("drag-over");
        return;
    }
    document.getElementById("file").files = e.dataTransfer.files;
    document.getElementById("file").dispatchEvent(new Event("change"));
    document.querySelector(".file-input-group").classList.remove("drag-over");
});
</script>
</body>
</html>

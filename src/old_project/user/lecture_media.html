<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lecture Media</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Inter', sans-serif;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      padding: 2rem;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-weight: 600;
      color: #5A0F61;
    }
    .media-viewer {
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 2rem;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fff;
    }
    .media-viewer iframe, .media-viewer video {
      width: 100%;
      height: 100%;
      border: none;
    }
    .audio-player {
      text-align: center;
    }
    .audio-label {
      font-size: 1.25rem;
      color: #5A0F61;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .audio-label i {
      color: #d6336c;
      font-size: 1.5rem;
    }
    audio {
      width: 100%;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Lecture 1 - Introduction</h1>
    </div>
    <div class="media-viewer">
      <!-- Video player for mp4 -->
      <video controls>
        <source src="../assets/Lecture 1 - Introduction.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="audio-player">
      <div class="audio-label">
        <i class="far fa-music"></i> Lecture Audio.mp3
      </div>
      <audio controls>
        <source src="../assets/Lecture Audio.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/calendar.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />

    <title>Calender</title>
    <style>
        /* Tablet responsiveness */
        @media (min-width: 768px) and (max-width: 1024px) {
            #calendar-main {
                padding-left: 24px;
                padding-right: 24px;
            }

            .calendar-title,
            .calendar-subtitle {
                font-size: 1.5rem;
            }

            .calendar-card {
                max-width: 100%;
            }

            .event-details-card.card,
            .card.calendar-card {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>

<body style="overflow-x:hidden;">
    <!-- Navbar -->
    <div id="sidebar-container"></div>
    <div id="content-wrapper" class="sidebar-hidden">
        <div id="navbar-container" class="fixed-top"></div>

        <!-- Main content -->
        <div class="container-fluid mt-5 px-2 px-md-4" id="calendar-main">
            <!-- Moved header and subtitle outside the card -->
            <h2 class="calendar-title text-center mb-3">Student Calendar</h2>
            <p class="calendar-subtitle text-center mb-4">Keep track of your academic schedule</p>
            <div class="card calendar-card p-4 mb-4">
                <!-- Calendar Section -->
                <div id="calendar-section-wrapper" class="calendar-section-wrapper">
                    <div id="calendar-section"></div>
                </div>
                <!-- Legend -->
                <div class="d-flex justify-content-left gap-4 mt-3">
                    <span><span class="event-dot event-dot-exam"></span> Exams</span>
                    <span><span class="event-dot event-dot-assignment"></span> Assignments</span>
                    <span><span class="event-dot event-dot-event"></span> Events</span>
                </div>
            </div>
            <!-- Details Section -->
            <div id="details-section"></div>
        </div>
    </div>
        <div id="toast-container"></div>
    <div id="loadingOverlayContainer" class="d-none w-full h-full"
        style="width: 100vw; height: 100vh; top: 0; left: 0; position: fixed;z-index: 999999999999;"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/loadscreen.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/calendar.js"></script>

</body>

</html>

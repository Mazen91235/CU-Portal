<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../components/navbar.html" />
    <link rel="stylesheet" href="../components/sidebar.html" />
    <link rel="stylesheet" href="../components/toasts.html" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/courses.css" />
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
    <style>
        /* ...existing code... */
        .course-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(90, 15, 97, 0.07);
            border: 1.5px solid #e2e8f0;
            padding: 1.5rem 1.2rem 1.2rem 1.2rem;
            margin-bottom: 24px;
            position: relative;
            min-width: 0;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .course-card .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #22223b;
            margin-bottom: 0.5rem;
            margin-top: 0;
            letter-spacing: 0.01em;
        }

        .course-code-badge {
            font-size: 0.95rem;
            font-weight: 600;
            color: #6d217f;
            background: #fff;
            border: 1.5px solid #6d217f;
            border-radius: 16px;
            padding: 2px 14px;
            display: inline-block;
            margin-left: 8px;
            margin-top: 2px;
        }

        .course-card .d-flex.justify-content-between {
            margin-bottom: 0.8rem;
        }

        .course-info-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
            margin-top: 10px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            font-size: 1.07rem;
            font-weight: 500;
            margin-bottom: 0;
            background: #f8f5f7;
        }

        .info-item span:first-child {
            text-align: left;
            flex: 1;
        }

        .info-item span:last-child {
            text-align: right;
            flex: 1;
        }

        .info-item.faculty-data {
            background: #f8edef;
            color: #6d217f;
        }

        .info-item.department {
            background: #f1f8fa;
            color: #2563eb;
        }

        .info-item.credits {
            background: #fcf9e6;
            color: #ca8a04;
        }

        .info-item.year,
        .info-item.deadline {
            background: #f1f8e6;
            color: #16a249;
        }

        .info-item img {
            width: 22px;
            height: 22px;
            margin-right: 10px;
            opacity: 0.7;
        }

        .info-item span {
            font-size: 1.07rem;
            font-weight: 500;
        }

        .info-value {
            font-size: 1.07rem;
            font-weight: 500;
            color: #22223b;
            margin-left: auto;
            text-align: right;
            background: none;
        }

        .btn-view-course {
            width: 100%;
            background: #6d217f;
            color: #fff;
            border-radius: 8px;
            font-size: 1.07rem;
            font-weight: 600;
            padding: 0.85rem 0;
            margin-top: 18px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.18s;
        }

        .btn-view-course i {
            font-size: 1.15rem;
            margin-right: 7px;
        }

        .dropdown {
            display: none !important;
        }

        /* Responsive grid for cards */
        #coursesContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        #coursesContainer>div {
            flex: 1 1 30%;
            max-width: 32%;
            min-width: 280px;
        }

        @media (max-width: 1200px) {
            #coursesContainer>div {
                flex: 1 1 45%;
                max-width: 48%;
            }
        }

        @media (max-width: 768px) {
            #coursesContainer>div {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }
        /* ...existing code... */
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Content wrapper: navbar + main content -->
    <div id="content-wrapper" class="sidebar-hidden">

        <div id="navbar-container" class="fixed-top"></div>
        <div id="main-content" class="p-4 mt-5">
            <div id="header" class="d-flex justify-content-between align-items-center ">
                <div id="r-header" class="d-flex flex-column align-items-start gap-3">
                    <h3 id="welcome-message" class="m-0"> My Enrolled Courses</h3>
                    <p id="semester" class="m-0">Easily navigate through your enrolled courses.</p>


                </div>

            </div>

            <div class="row">
                <span class="d-flex  align-items-center gap-3">
                    <h4 class="fw-bold">
                        <img src="../assets/SVG (12).svg" alt="ecourses"
                            style="width: 45px;  border-radius: 6px; padding: 3px;" class="mb-1 bo">
                        Enrolled Courses
                    </h4>
                    <p id="c-num" class="mb-2"
                        style="background-color: #5E0B66; border-radius: 9999px; color: white; font-size: 12px; padding: 2px 10px;">
                        0 Courses</p>
                </span>

                <div class="row courses g-4 " id="coursesContainer">
                    <!-- Course cards will be dynamically inserted here -->
                </div>

            </div>

        </div>





    </div>
    <div id="toast-container"></div>
    <div id="loadingOverlayContainer" class="d-none w-full h-full"
        style="width: 100vw; height: 100vh; top: 0; left: 0; position: fixed;z-index: 999999999999;"></div>
    </div>

















    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/loadscreen.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/courses.js"></script>
    <script src="../js/script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const enrolledCourses = await fetchEnrolledCourses();
            populateCourses(enrolledCourses);
        });

        function populateCourses(courses) {
            const container = document.getElementById('coursesContainer');
            const countSpan = document.getElementById('c-num');
            container.innerHTML = '';
            countSpan.textContent = courses.length + ' Courses';

            if (courses.length === 0) {
                container.innerHTML = '<p>No enrolled courses found.</p>';
                return;
            }

            courses.forEach(course => {
                const col = document.createElement('div');
                col.className = 'col-lg-4 col-md-6 col-sm-12';

                const card = document.createElement('div');
                card.className = 'card p-3 shadow rounded-4 course-card';

                card.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <h5 class="card-title mb-0" style="color:#334155">${course.name || 'Critical & Creative Thinking'}</h5>
                  <span class="course-code-badge">${course.code || 'GEN001'}</span>
                </div>
                <div class="course-info-row">
                  <div class="info-item" style="background:rgba(255,0,0,0.05);">
                    <span class="fw-light" style="color: #64748B;">Faculty</span>
                    <span class="fw-light" style="color: #64748B;">${course.faculty?.name || 'Mathematics'}</span>
                  </div>
                  <div class="info-item" style="background:rgba(0,128,128,0.05);">
                    <span class="fw-light" style="color: #64748B;">Department</span>
                    <span class="fw-light" style="color: #64748B;">${course.department?.name || 'Applied Mathematics'}</span>
                  </div>
                  <div class="info-item" style="background:rgba(0,128,0,0.05);">
                    <span class="fw-light" style="color: #64748B;">Year</span>
                    <span class="fw-light" style="color: #64748B;">${course.year?.year || '2024/2025'}</span>
                  </div>
                  <div class="info-item" style="background:rgba(255,255,0,0.05);">
                    <span class="fw-light" style="color: #64748B;">Credits</span>
                    <span class="fw-light" style="color: #64748B;">${course.credits || '4'}</span>
                  </div>
                </div>
                <div>
                <button class="btn-view-course" style="width:100%;background:#6d217f;color:#fff;border-radius:8px;font-size:1.07rem;font-weight:600;padding:0.85rem 0;margin-top:18px;border:none;display:flex;align-items:center;justify-content:center;gap:8px;">
                  <i class="far fa-eye"></i> View Course
                </button>
                </div>
            `;

                col.appendChild(card);
                container.appendChild(col);
            });
        }
    </script>

</body>

</html>

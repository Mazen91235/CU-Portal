<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/course-settings.css">
    <link rel="stylesheet" href="../css/courses.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body style="overflow-x:hidden;">
    <div id="sidebar-container"></div>
    <div id="content-wrapper" class="sidebar-hidden">
        <div id="navbar-container" class="fixed-top"></div>

        <!-- Main Card Container -->
        <div class="container-fluid d-flex justify-content-center align-items-start py-4 main-card-container">
            <div class="bg-white shadow rounded-4 p-4 main-card">
                <!-- Title -->
                <h3 class="fw-semibold mb-1">Courses Settings</h3>
                <div class="section-underline"></div>
                
                <!-- Registered Courses Section -->
                <div class="mb-4">
                    <div class="d-flex align-items-center mb-5">
                        <img src="../assets/hat.png" alt="Hat Icon" class="me-2" style="width:24px;height:24px;vertical-align:-0.15em;">
                        <span class="fs-4 fw-semibold me-2">Registered Courses</span>
                        <span class="badge rounded-pill px-3 py-1 courses-badge" id="registered-count">0 Courses</span>
                    </div>
                    <!-- Courses Grid -->
                    <div class="row g-3" id="registered-courses">
                        <!-- Registered courses will be loaded here -->
                    </div>
                </div>

                <!-- Available Courses Section -->
                <div class="mb-4">
                    <div class="d-flex align-items-center mb-3">
                        <img src="../assets/hat.png" alt="Hat Icon" class="me-2" style="width:24px;height:24px;vertical-align:-0.15em;">
                        <span class="fs-4 fw-semibold me-2">Available Courses</span>
                        <span class="badge rounded-pill px-3 py-1 courses-badge" id="available-count">0 Courses</span>
                    </div>

                    <!-- Search bar - full width -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <input type="text" class="form-control search-input" id="available-search" placeholder="Search by subject name, instructor, or code" aria-label="Search context" onkeyup="searchAvailableCourses(this.value)">
                        </div>
                    </div>

                    <!-- Available Courses Grid -->
                    <div class="row g-3" id="available-courses">
                        <!-- Available courses will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
              <div id="toast-container"></div>
              <div id="popup-container" ></div>
         <div id="loadingOverlayContainer" class="d-none w-full h-full"
        style="width: 100vw; height: 100vh; top: 0; left: 0; position: fixed;z-index: 999999999999;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/popup.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/loadscreen.js"></script>
    <script src="../js/course-settings-filters.js"></script>
    <script src="../js/courses.js"></script>
    <script src="../js/registered_courses.js"></script>
</body>
</html>

<script>

  function formatAgo(dateStr) {
    // Convert your API format ("19 Sep, 2025") to Date object
    const date = new Date(dateStr);
    if (isNaN(date)) return dateStr; // fallback if parsing fails

    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / (60 * 1000));
    const diffHours = Math.floor(diffMs / (60 * 60 * 1000));
    const diffDays = Math.floor(diffMs / (24 * 60 * 60 * 1000));

    if (diffMins < 60) return `${diffMins} min ago`;
    if (diffHours < 24) return `${diffHours} hours ago`;
    if (diffDays === 1) return "1 day ago";
    return `${diffDays} days ago`;
  }

 let unreadNotifications = [];
let readNotifications = [];

async function loadNotifications() {
  try {
    // Fetch unread (seen=false)
    const unreadRes = await getNotifications({ seen: false, page: 1, limit: 10 });
    unreadNotifications = (unreadRes?.data || []).map(n => ({
      id: n.id,
      type: n.type,
      title: n.content,
      url: n.url,
      date: n.created_at,
      unread: true
    }));

    // Fetch read (seen=true)
    const readRes = await getNotifications({ seen: true, page: 1, limit: 10 });
    readNotifications = (readRes?.data || []).map(n => ({
      id: n.id,
      type: n.type,
      title: n.content,
      url: n.url,
      date: n.created_at,
      unread: false
    }));

   
    renderNotificationsPage();
  } catch (err) {
    showToast("error", "Error loading notifications", err.message || "Please try again later.", "");
  }
}

  // ---- PAGE RENDER ----
  function renderNotificationsPage() {
    const unreadSection = document.getElementById('unreadSection');
    unreadSection.innerHTML = '';

    unreadNotifications.forEach(n => {
      unreadSection.innerHTML += `
        <div class="notification-flex-card" style="display:flex;align-items:center;background:#fff;border-radius:12px;
          box-shadow: 0 1.85px 6.25px rgba(0, 0, 0, 0.19), 0 0.5px 6.25px rgba(0, 0, 0, 0.039);padding:18px 24px;border-left:4px solid #5A0F61;
          min-height:64px;margin-bottom:18px;gap:18px;">
          <img src="../assets/${getIcon(n.type)}" alt="${n.type}" style="width:32px;height:32px;margin-right:18px;">
          <div class="notification-flex-content" style="flex:1;">
            <span href="${n.url}" target="_blank" style="text-decoration:none;color:inherit;">
              <div class="notification-flex-title" style="color:#64748B;font-size:18px;margin-bottom:4px;">${n.title}</div>
            </span>
            <div class="notification-flex-subtitle" style="color:#94A3B8;font-size:14px;">${formatAgo(n.date)}</div>
          </div>
          <div class="notification-flex-btn-row">
            <button class="mark-read-btn" data-id="${n.id}" style="
              padding:4px 12px;border-radius:8px;background:#F0FDF4;color:#16A34A;border:none;cursor:pointer;">
              Mark As Read
            </button>
          </div>
        </div>`;
  });

  const readSection = document.getElementById('readSection');
  readSection.innerHTML = `<h2 style="color:#64748B;font-size:20px;font-weight:600;margin-bottom:16px;">Read Notifications</h2>`;
  readNotifications.forEach(n => {
    readSection.innerHTML += `
      <div class="notification-flex-card" style="display:flex;align-items:center;background:#fff;border-radius:12px;
        box-shadow: 0 1.85px 6.25px rgba(0, 0, 0, 0.19), 0 0.5px 6.25px rgba(0, 0, 0, 0.039);padding:18px 24px;border-left:4px solid #5A0F61;
        min-height:64px;margin-bottom:18px;gap:18px;">
        <img src="../assets/${getIcon(n.type)}" alt="${n.type}" style="width:32px;height:32px;margin-right:18px;">
        <div class="notification-flex-content" style="flex:1;">
          <span href="${n.url}" target="_blank" style="text-decoration:none;color:inherit;">
            <div class="notification-flex-title" style="color:#64748B;font-size:18px;margin-bottom:4px;">${n.title}</div>
          </span>
          <div class="notification-flex-subtitle" style="color:#94A3B8;font-size:14px;">${formatAgo(n.date)}</div>
        </div>
        <div class="notification-flex-btn-row">
        <a href="${n.url}" target="_blank" style="text-decoration:none;color:inherit;">
          <i class="far fa-eye me-1 fs-5" style="color:#5A0F61;"></i>
        </a>
        </div>
      </div>`;
  });

  // Update unread count
  const unreadCount = unreadNotifications.length;
  document.querySelector('div[style*="color: #F97316"]').textContent =
    `You have ${unreadCount} unread notification${unreadCount === 1 ? '' : 's'}`;
}

  // ---- ICON PICKER ----
  function getIcon(type) {
    switch (type) {
      case "grade": return "Margin.svg";
      case "due": return "Margin (3).svg";
      case "material": return "Margin (2).svg";
      case "reminder": return "Margin (1).svg";
      default: return "y8.svg"; // fallback
    }
  }

  

 document.addEventListener("click", async function(e) {
  if (e.target.closest('.mark-read-btn')) {
    const id = e.target.closest('.mark-read-btn').dataset.id;

    // Mark on the backend
    await markNotificationAsSeen(id);

    // Find and remove from unread
    const idx = unreadNotifications.findIndex(n => n.id == id);
    if (idx !== -1) {
      const notif = unreadNotifications[idx];
      notif.unread = false;

      // Move to read list
      readNotifications.unshift(notif); // put it at the top
      unreadNotifications.splice(idx, 1); // remove from unread
    }

    // Re-render both sections
    renderNotificationsPage();
    renderNotificationsDropdown();
  }
});


document.getElementById("markAllReadBtn").addEventListener("click", async () => {
  if (unreadNotifications.length === 0) return;

  try {
     await markAllNotificationsAsSeen();

    // Move all unread → read
    unreadNotifications.forEach(n => n.unread = false);
    readNotifications = [...unreadNotifications, ...readNotifications];
    unreadNotifications = [];

    // Re-render
    renderNotificationsPage();
    renderNotificationsDropdown();
  } catch (err) {
    showToast("error","error","Error marking all notifications as read", "");
  }
});

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam</title>
    <link rel="stylesheet" href="./css/exam-add.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/sidebar.css">
    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/toasts.css">
    <link rel="stylesheet" href="./components/navbar.html">
    <link rel="stylesheet" href="./components/sidebar.html">
    <link rel="stylesheet" href="./components/toasts.html">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    
</head>
<body style="background-color: rgb(248, 250, 252);">
<div id="sidebar-container"></div>
    <div id="content-wrapper" class="sidebar-hidden">
        <div id="navbar-container" class="fixed-top"></div>

        <!-- Banner Section -->
        <section class="banner-section" style="margin-top:72px;">
            <div style="display: flex; align-items: center;">
                <a href="exams.html" class="banner-back-link" style="color: #fff; text-decoration: none; display: flex; align-items: center; font-size: 1rem; margin-left: 32px; margin-right: 24px;">
                    <i class="fa fa-arrow-left" style="margin-right: 8px; font-size: 1.1rem;"></i>
                    Back to Exams
                </a>
                <div>
                    <div class="banner-title" style="display: flex; align-items: center;">
                        <img src="./assets/exam1.png" alt="Task Icon" style="margin-right: 12px; width: 32px; height: 32px;">
                        Create New Exam
                    </div>
                    <div class="banner-desc">
                        Add a new exam for your students
                    </div>
                </div>
            </div>
        </section>
        <!-- End Banner Section -->

        <!-- Main Form Section -->
        <section class="form-section">
            <form class="form-card">
                <!-- Basic Information -->
                <div class="form-section-card">
                    <div class="form-section-header">
<img src="./assets/exam2.png" alt="Exam Icon" style="margin-right: 8px; width: 20px; height: 20px;">
                        <span>Basic Information</span>
                    </div>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Course Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="e.g., Operating Systems,CS301">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Exam Type <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="e.g. Midterm, Final">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Exam Format</label>
                            <input type="text" class="form-control" placeholder="e.g. Multiple Choice, Oral">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Exam Weight</label>
                            <input type="text" class="form-control" placeholder="e.g., 10% or 30 marks">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="2" placeholder="Brief description of the exam content..."></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Instruction</label>
                            <textarea class="form-control" rows="2" placeholder="Write clear guidelines students must follow during the exam"></textarea>
                        </div>
                    </div>
                </div>
                <!-- Schedule & Location -->
                <div class="form-section-card">
                    <div class="form-section-header">
                        <img src="./assets/exam3.png" alt="Exam Icon" style="margin-right: 8px; width: 20px; height: 20px;">
                        <span>Schedule & Location</span>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Exam Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" placeholder="Select a Date">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Start Time <span class="text-danger">*</span></label>
                            <input type="time" class="form-control" placeholder="--:--">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" placeholder="e.g., Math Building, Room 301">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Duration</label>
                            <input type="text" class="form-control" placeholder="e.g., 2 hours">
                        </div>
                    </div>
                </div>
                <!-- Access Permissions -->
                <div class="form-section-card">
                    <div class="form-section-header">
<img src="./assets/exam4.png" alt="Exam Icon" style="margin-right: 8px; width: 28px; height: 20px;">
                        <span>Access Permissions</span>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Faculty</label>
                            <input type="text" class="form-control" placeholder="e.g., Computer Science">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" placeholder="e.g., Software Engineering">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Year Level</label>
                            <input type="text" class="form-control" placeholder="e.g., 3rd Year">
                        </div>
                    </div>
                </div>
                <!-- Action Buttons -->
                <div class="d-flex justify-content-end mt-4">
                    <button type="button" class="btn btn-secondary me-2">Cancel</button>
                    <button type="submit" class="btn btn-primary">
<img src="./assets/exam5.png" alt="Exam Icon" style="margin-right: 8px; width: 16px; height: 16px;">
                        Create Exam
                    </button>
                </div>
            </form>
        </section>
        <!-- End Main Form Section -->

    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/loading.js"></script>
    <script>
        // File upload preview and remove logic
        const fileInput = document.getElementById('fileInput');
        const uploadedFilesList = document.getElementById('uploadedFilesList');
        let uploadedFiles = [];

        fileInput.addEventListener('change', function() {
            for (const file of fileInput.files) {
                if (!uploadedFiles.some(f => f.name === file.name && f.size === file.size)) {
                    uploadedFiles.push(file);
                }
            }
            renderUploadedFiles();
            // Reset input so same file can be re-added if removed
            fileInput.value = '';
        });

        function renderUploadedFiles() {
            uploadedFilesList.innerHTML = '';
            uploadedFiles.forEach((file, idx) => {
                const item = document.createElement('div');
                item.className = 'uploaded-file-item';
                item.innerHTML = `
                    <span class="uploaded-file-name" title="${file.name}">${file.name}</span>
                    <button type="button" class="remove-upload-btn" aria-label="Remove file" onclick="removeUploadedFile(${idx})">
                        <i class="fa fa-times"></i>
                    </button>
                `;
                uploadedFilesList.appendChild(item);
            });
        }

        window.removeUploadedFile = function(idx) {
            uploadedFiles.splice(idx, 1);
            renderUploadedFiles();
        };

        // Optional: Drag & drop support
        const fileDropArea = document.getElementById('fileDropArea');
        fileDropArea.addEventListener('dragover', e => {
            e.preventDefault();
            fileDropArea.style.borderColor = '#7b2ff2';
        });
        fileDropArea.addEventListener('dragleave', e => {
            fileDropArea.style.borderColor = '#d1c4e9';
        });
        fileDropArea.addEventListener('drop', e => {
            e.preventDefault();
            fileDropArea.style.borderColor = '#d1c4e9';
            const files = Array.from(e.dataTransfer.files);
            for (const file of files) {
                if (!uploadedFiles.some(f => f.name === file.name && f.size === file.size)) {
                    uploadedFiles.push(file);
                }
            }
            renderUploadedFiles();
        });

        // Link add/remove logic
        const attachedLinksList = document.getElementById('attachedLinksList');
        const addLinkBtn = document.getElementById('addLinkBtn');

        function createLinkRow(title = '', url = '') {
            const row = document.createElement('div');
            row.className = 'attached-links-row mb-2';
            row.innerHTML = `
                <input type="text" class="form-control attached-link-title" placeholder="Link title" value="${title}">
                <input type="url" class="form-control attached-link-url" placeholder="https://" value="${url}">
                <button type="button" class="remove-link-btn" tabindex="-1">
                    <i class="fa fa-times"></i>
                </button>
            `;
            // Remove button logic
            row.querySelector('.remove-link-btn').onclick = function() {
                row.remove();
            };
            return row;
        }

        addLinkBtn.onclick = function() {
            const newRow = createLinkRow();
            attachedLinksList.appendChild(newRow);
        };

        // Subject filter dropdown logic (identical to tasks.html)
        (function() {
            const filter = document.getElementById('customSubjectFilter');
            const dropdown = document.getElementById('customSubjectDropdown');
            const valueSpan = document.getElementById('customSubjectValue');
            const hiddenInput = document.getElementById('subject_hidden');

            filter.addEventListener('click', function(e) {
                filter.classList.toggle('open');
                dropdown.style.display = filter.classList.contains('open') ? 'block' : 'none';
                e.stopPropagation();
            });

            dropdown.addEventListener('mousedown', function(e) {
                if (e.target.tagName === 'LI') {
                    dropdown.querySelectorAll('li').forEach(li => li.classList.remove('active'));
                    e.target.classList.add('active');
                    valueSpan.textContent = e.target.textContent;
                    hiddenInput.value = e.target.getAttribute('data-value');
                    filter.classList.remove('open');
                    dropdown.style.display = 'none';
                }
            });

            document.addEventListener('click', function(e) {
                if (!filter.contains(e.target) && !dropdown.contains(e.target)) {
                    filter.classList.remove('open');
                    dropdown.style.display = 'none';
                }
            });
        })();

        // Deadline date field: show placeholder and open picker on click, update value as date picked
        (function() {
            const deadlineInput = document.getElementById('deadline');
            const placeholder = document.getElementById('deadlinePlaceholder');

            function formatDate(val) {
                if (!val) return "Pick a date";
                const d = new Date(val);
                if (isNaN(d)) return "Pick a date";
                return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            }

            function updatePlaceholder() {
                if (deadlineInput.value) {
                    placeholder.textContent = formatDate(deadlineInput.value);
                    placeholder.style.color = "#22223b";
                } else {
                    placeholder.textContent = "Pick a date";
                    placeholder.style.color = "#b0b0b0";
                }
            }
            deadlineInput.addEventListener('input', updatePlaceholder);
            updatePlaceholder();

            // Change placeholder background on focus/blur
            deadlineInput.addEventListener('focus', function() {
                placeholder.style.background = "#fff";
            });
            deadlineInput.addEventListener('blur', function() {
                placeholder.style.background = "#f8fafc";
            });

            // Open date picker when clicking anywhere in the field
            const field = deadlineInput.parentElement;
            field.addEventListener('click', function(e) {
                if (typeof deadlineInput.showPicker === 'function') {
                    deadlineInput.showPicker();
                } else {
                    deadlineInput.focus();
                    deadlineInput.click();
                }
            });
        })();
    </script>
</body>
</html>

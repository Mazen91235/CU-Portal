<label class="form-label fw-semibold personal-details-label">Select Option</label>
<div id="select-group" style="position:relative;">
  <input type="text" class="form-control input-icon-right w-100" id="select_input" name="select_input" placeholder="Select an option" readonly style="background-color:#fff; cursor:pointer;">
  <ul id="select-dropdown" class="select-dropdown-list">
    <li data-value="option1"><span>Option 1</span></li>
    <li data-value="option2"><span>Option 2</span></li>
  </ul>
  <input type="hidden" name="select" id="select_hidden">
  <span id="select-arrow" style="position:absolute; right:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; pointer-events:none; transition:transform 0.2s;">
    <img src="../assets/iconsax-arrow-down-02.png" alt="arrow" style="width:100%;height:100%;display:block;transition:transform 0.2s;">
  </span>
</div>
<style>
/* filepath: d:\Students Portal CU\StudentsPortal-CU\css\personal-details.css */
@import url('https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap');

.personal-details-label {
  font-family: 'Roboto', Arial, sans-serif !important;
  font-weight: 500 !important;
  font-size: 16px !important;
  text-align: left !important;}
#select-group .form-control {
  border-radius: 12px;
  border: 1px solid #E0E0E0;
  background: #fff;
  font-size: 15px;
  color: #333;
  height: 44px;
  box-shadow: none;
  padding-left: 16px;
  padding-right: 40px;
}

#select-group .input-icon-right {
  background-position: right 1rem center  !important;
  background-size: 20px 20px !important;
  background-repeat: no-repeat !important;
  padding-right: 2.5rem !important;
}

#select-group .w-100 {
  width: 100% !important;

  color: rgba(0, 0, 0, 0.38);
}
#select-group {
  position: relative;

}

.select-dropdown-list {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  z-index: 10;
  margin: 0;
  padding: 0;
  list-style: none;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 0 0 8px 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  min-width: 100%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.select-dropdown-list.open {
  opacity: 1;
  pointer-events: auto;
  border-radius: 12px;
  border-color: #5a0f61;
}

.select-dropdown-list li {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  box-sizing: border-box;
  width: 100%; /* full width for separator and background */
  padding: 6px 12px; /* minimized and equal padding */
  margin: 0;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  font-family: 'Inter', 'Roboto', Arial, sans-serif;
  font-size: 16px;
  color: #333;
  font-weight: 500;
  letter-spacing: 0.01em;
  border-bottom: 1px solid #f0f0f0;
  background: transparent;
}

.select-dropdown-list li > span {
  display: inline-block;
}


/* Add active class for selected item */
.select-dropdown-list li.active {
  background: #f3f3f3;
  color: #5a0f61;
  border-radius: 12px;
}

.select-dropdown-list li:last-child {
  border-bottom: none;
}

.select-dropdown-list li:hover {
  background: #f3f3f3;
  color: #5a0f61;
  border-radius: 12px;
}




</style>
<script>
  (function() {
    const selectInput = document.getElementById('select_input');
    const selectDropdown = document.getElementById('select-dropdown');
    const selectGroup = document.getElementById('select-group');
    const selectHidden = document.getElementById('select_hidden');
    const selectArrow = document.getElementById('select-arrow').querySelector('img');

    function toggleDropdown() {
      selectDropdown.classList.toggle('open');
      if (selectDropdown.classList.contains('open')) {
        selectArrow.style.transform = 'rotate(180deg)';
      } else {
        selectArrow.style.transform = 'rotate(0deg)';
      }
    }

    function closeDropdown(e) {
      if (!selectGroup.contains(e.target)) {
        selectDropdown.classList.remove('open');
        selectArrow.style.transform = 'rotate(0deg)';
      }
    }

    selectInput.addEventListener('click', toggleDropdown);

    selectDropdown.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', function() {
        selectInput.value = li.textContent;
        selectHidden.value = li.getAttribute('data-value');
        // Remove active from all, add to selected
        selectDropdown.querySelectorAll('li').forEach(item => item.classList.remove('active'));
        li.classList.add('active');
        selectDropdown.classList.remove('open');
        selectArrow.style.transform = 'rotate(0deg)';
      });
    });

    document.addEventListener('mousedown', closeDropdown);
  })();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Upload</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f9f6ff;
      margin: 0;
    }

    .upload-box {
      width: 600px;
      height: 350px;
      border: 2px dashed #c44bc2;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: white;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
      box-shadow: 0 0 10px rgba(184, 79, 198, 0.2);
      position: relative;
      padding: 20px;
      box-sizing: border-box;
    }

    .upload-box.dragover {
      background: #f0eaff;
      border-color: #9b3db8;
      box-shadow: 0 0 15px rgba(194, 63, 194, 0.4);
    }

    .plus-button {
      width: 70px;
      height: 70px;
      background-color: #99319d;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 40px;
      font-weight: bold;
      box-shadow:
        0 0 0 10px rgba(90, 61, 184, 0.1),
        0 0 0 20px rgba(90, 61, 184, 0.05),
        0 0 20px 10px rgba(90, 61, 184, 0.2);
      user-select: none;
      margin-bottom: 20px;
    }

    .upload-box p.main-text {
      font-size: 22px;
      font-weight: 700;
      color: #333;
      margin: 0;
      user-select: none;
    }

    .upload-box p.sub-text {
      font-size: 14px;
      color: #777;
      margin: 5px 0 0 0;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="upload-box" id="drop-area" tabindex="0" role="button" aria-label="File upload area">
    <div class="plus-button">+</div>
    <p class="main-text">Drop files Here to Upload</p>
    <p class="sub-text">Release to add file to material</p>
    <input type="file" id="fileInput" hidden multiple />
  </div>

  <script>
    const dropArea = document.getElementById("drop-area");
    const fileInput = document.getElementById("fileInput");

    // Click to open file picker
    dropArea.addEventListener("click", () => fileInput.click());

    // Handle drag over
    dropArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropArea.classList.add("dragover");
    });

    // Handle drag leave
    dropArea.addEventListener("dragleave", () => {
      dropArea.classList.remove("dragover");
    });

    // Handle drop
    dropArea.addEventListener("drop", (e) => {
      e.preventDefault();
      dropArea.classList.remove("dragover");

      const files = e.dataTransfer.files;
      handleFiles(files);
    });

    // Handle file selection
    fileInput.addEventListener("change", () => {
      handleFiles(fileInput.files);
    });

    function handleFiles(files) {
      [...files].forEach(file => {
        console.log("File uploaded:", file.name);
        alert(`Uploaded: ${file.name}`);
      });
    }
  </script>
</body>
</html>

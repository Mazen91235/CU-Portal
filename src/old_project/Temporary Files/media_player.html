<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP3 Player Popup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Trigger Button */
    .open-btn {
      padding: 12px 20px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Popup overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    /* MP3 Player container */
    .player {
      width: 80%;
      max-width: 900px;
      height: 90%;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    .topbar {
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      font-size: 14px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #555;
      font-weight: bold;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: #444;
    }

    /* Content */
    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
    }

    .music-icon svg {
      width: 50px;
      height: 50px;
      fill: #e91e63;
    }

    .filename {
      font-size: 18px;
      font-weight: 500;
      color: #222;
    }
  </style>
</head>
<body>

  <!-- Open Button -->
  <button class="open-btn" onclick="openPlayer()">Open MP3 Player</button>

  <!-- Popup Overlay -->
  <div class="overlay" id="mp3Overlay">
    <div class="player">
      <!-- Top bar -->
      <div class="topbar">
        <div class="topbar-left">
          <span>Mp3</span>
          <span>Lecture 1 - Introduction.mp4</span>
        </div>
        <div class="topbar-right">
          <!-- Download -->
          <div class="icon-btn">
            <img src="../assets/download.svg" alt="Download" style="width:20px; height:20px;" />
          </div>
          <!-- Close -->
          <div class="icon-btn" onclick="closePlayer()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M18.3 5.71L12 12l6.3 6.29-1.42 1.42L10.59 13.41 4.29 19.71 2.87 18.29 9.17 12 2.87 5.71 4.29 4.29 10.59 10.59 16.89 4.29z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="content">
        <div class="music-icon">
          <!-- Music Note Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
          </svg>
        </div>
        <div class="filename">Lecture Audio.mp3</div>
        <audio controls>
          <source src="your-audio.mp3" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
      </div>
    </div>
  </div>

  <script>
    function openPlayer() {
      document.getElementById("mp3Overlay").style.display = "flex";
    }
    function closePlayer() {
      document.getElementById("mp3Overlay").style.display = "none";
    }
  </script>
</body>
</html>

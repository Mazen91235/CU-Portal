<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Copy Dialog</title>
    <style>
        :root {
            --primary-color: hsla(295, 85%, 38%, 1);
            --primary-hover: hsla(295, 85%, 30%, 1);
            --background-color: hsla(0, 0%, 98%, 1);
            --border-color: #ddd;
            --hover-bg: #f5f5f5;
            --text-color: #333;
            --path-color: #0066cc;
            --path-gray: #666; /* Gray color for non-current path segments */
            --folder-color: #020817; /* Dark color for folder icon to contrast with light background */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .dialog-container {
            background-color: var(--background-color);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 700px; /* Increased from 600px */
            overflow: hidden;
        }

        .dialog-header {
            background-color: var(--background-color);
            padding: 16px 20px; /* Reduced padding */
            border-bottom: 1px solid var(--border-color);
        }

        .dialog-title {
            font-size: 14px; /* Reduced from 15px */
            font-weight: 600;
            color: var(--text-color);
        }

        .dialog-content {
            padding: 20px; /* Reduced from 24px */
            background-color: var(--background-color);
        }

        .navigation-path {
            display: flex;
            align-items: center;
            margin-bottom: 16px; /* Reduced from 18px */
            flex-wrap: wrap;
        }

        .path-segment {
            color: var(--path-gray); /* Changed to gray */
            cursor: pointer;
            font-size: 12px; /* Reduced from 13px */
            padding: 2px 4px;
            border-radius: 3px;
        }

        .path-segment:hover {
            background-color: var(--hover-bg);
        }

        .path-segment.current {
            color: var(--primary-color);
            font-weight: 500;
        }

        .path-separator {
            margin: 0 5px;
            color: #666;
            font-size: 12px; /* Reduced from 13px */
        }

        .new-folder-btn {
            margin-left: auto;
            background-color: white;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px; /* Reduced padding */
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px; /* Reduced from 13px */
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .new-folder-btn:hover {
            background-color: var(--hover-bg);
        }

        .folder-list {
            border-radius: 4px;
            max-height: 340px;
            overflow-y: auto;
            background-color: white;
        }

        .folder-item {
            display: flex;
            align-items: center;
            padding: 10px 16px; /* Reduced padding */
            cursor: pointer;
            transition: background-color 0.2s;
            background-color: white;
        }

        .folder-item:hover {
            background-color: var(--hover-bg);
        }

        .folder-item.selected {
            color: var(--primary-color);
            font-weight: 500;
        }

        .folder-icon {
            width: 22px; /* Reduced from 24px */
            height: 22px; /* Reduced from 24px */
            margin-right: 10px; /* Reduced from 12px */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .folder-icon svg {
            width: 16px; /* Reduced from 18px */
            height: 16px; /* Reduced from 18px */
            fill: var(--folder-color);
        }

        .folder-item.selected .folder-icon svg {
            fill: var(--primary-color);
        }

        .folder-name {
            font-size: 12px; /* Reduced from 13px */
        }

        .dialog-footer {
            display: flex;
            justify-content: flex-end;
            padding: 16px 20px; /* Reduced padding */
            border-top: 1px solid var(--border-color);
            gap: 10px; /* Reduced from 12px */
            background-color: var(--background-color);
        }

        .btn {
            padding: 8px 16px; /* Reduced padding */
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px; /* Reduced from 13px */
            font-weight: 500;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-cancel {
            background-color: white;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-cancel:hover {
            background-color: var(--hover-bg);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .new-folder-input {
            display: none;
            margin-top: 10px; /* Reduced from 12px */
            padding: 8px; /* Reduced from 10px */
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            font-size: 12px; /* Reduced from 13px */
            background-color: white;
        }

        .new-folder-actions {
            display: none;
            margin-top: 10px; /* Reduced from 12px */
            justify-content: flex-end;
            gap: 8px; /* Reduced from 10px */
        }

        .status-message {
            margin-top: 16px; /* Reduced from 18px */
            padding: 10px; /* Reduced from 12px */
            border-radius: 4px;
            font-size: 12px; /* Reduced from 13px */
            display: none;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const folderItems = document.querySelectorAll('.folder-item');
            const copyBtn = document.getElementById('copyBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const newFolderBtn = document.querySelector('.new-folder-btn');
            const newFolderInput = document.getElementById('newFolderInput');
            const newFolderActions = document.getElementById('newFolderActions');
            const cancelNewFolder = document.getElementById('cancelNewFolder');
            const createNewFolder = document.getElementById('createNewFolder');
            const folderList = document.getElementById('folderList');
            const statusMessage = document.getElementById('statusMessage');
            const pathSegments = document.querySelectorAll('.path-segment');
            
            let selectedFolder = null;
            let currentPath = ['Home', 'My Files', 'Mathematics 101', 'Week 1', 'My Files', 'My Files'];
            
            // Folder selection
            folderItems.forEach(item => {
                item.addEventListener('click', function() {
                    // Remove previous selection
                    if (selectedFolder) {
                        selectedFolder.classList.remove('selected');
                    }
                    
                    // Select current folder
                    this.classList.add('selected');
                    selectedFolder = this;
                    copyBtn.disabled = false;
                });
                
                // Double-click to navigate
                item.addEventListener('dblclick', function() {
                    const folderName = this.getAttribute('data-folder');
                    navigateToFolder(folderName);
                });
            });
            
            // Path navigation
            pathSegments.forEach(segment => {
                segment.addEventListener('click', function() {
                    const path = this.getAttribute('data-path');
                    const index = currentPath.indexOf(path);
                    
                    if (index !== -1) {
                        currentPath = currentPath.slice(0, index + 1);
                        updatePathDisplay();
                        updateFolderList();
                    }
                });
            });
            
            // New folder functionality
            newFolderBtn.addEventListener('click', function() {
                newFolderInput.style.display = 'block';
                newFolderActions.style.display = 'flex';
                newFolderInput.focus();
            });
            
            cancelNewFolder.addEventListener('click', function() {
                hideNewFolderUI();
            });
            
            createNewFolder.addEventListener('click', function() {
                const folderName = newFolderInput.value.trim();
                if (folderName) {
                    createFolder(folderName);
                } else {
                    showStatus('Please enter a folder name', 'error');
                }
            });
            
            newFolderInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    createNewFolder.click();
                } else if (e.key === 'Escape') {
                    cancelNewFolder.click();
                }
            });
            
            // Cancel button
            cancelBtn.addEventListener('click', function() {
                showStatus('Copy operation cancelled', 'success');
                setTimeout(() => {
                    // In a real app, this would close the dialog
                    document.body.style.opacity = '0';
                    setTimeout(() => {
                        alert('Dialog closed');
                    }, 300);
                }, 1000);
            });
            
            // Copy button
            copyBtn.addEventListener('click', function() {
                if (selectedFolder) {
                    const folderName = selectedFolder.getAttribute('data-folder');
                    showStatus(`Successfully copied 5 items to ${folderName}`, 'success');
                    
                    setTimeout(() => {
                        // In a real app, this would close the dialog
                        document.body.style.opacity = '0';
                        setTimeout(() => {
                            alert('Dialog closed');
                        }, 300);
                    }, 1500);
                }
            });
            
            function navigateToFolder(folderName) {
                currentPath.push(folderName);
                updatePathDisplay();
                updateFolderList();
                
                // Clear selection
                if (selectedFolder) {
                    selectedFolder.classList.remove('selected');
                    selectedFolder = null;
                    copyBtn.disabled = true;
                }
            }
            
            function updatePathDisplay() {
                const pathContainer = document.querySelector('.navigation-path');
                pathContainer.innerHTML = '';
                
                currentPath.forEach((segment, index) => {
                    const pathSegment = document.createElement('div');
                    pathSegment.className = 'path-segment';
                    
                    // Add 'current' class to the last segment
                    if (index === currentPath.length - 1) {
                        pathSegment.classList.add('current');
                    }
                    
                    pathSegment.setAttribute('data-path', segment);
                    pathSegment.textContent = segment;
                    pathContainer.appendChild(pathSegment);
                    
                    if (index < currentPath.length - 1) {
                        const separator = document.createElement('div');
                        separator.className = 'path-separator';
                        separator.textContent = '>';
                        pathContainer.appendChild(separator);
                    }
                });
                
                // Re-add the New Folder button
                const newFolderBtn = document.createElement('button');
                newFolderBtn.className = 'new-folder-btn';
                newFolderBtn.innerHTML = '<span>+</span> New Folder';
                newFolderBtn.addEventListener('click', function() {
                    newFolderInput.style.display = 'block';
                    newFolderActions.style.display = 'flex';
                    newFolderInput.focus();
                });
                pathContainer.appendChild(newFolderBtn);
                
                // Re-attach path navigation
                document.querySelectorAll('.path-segment').forEach(segment => {
                    segment.addEventListener('click', function() {
                        const path = this.getAttribute('data-path');
                        const index = currentPath.indexOf(path);
                        
                        if (index !== -1) {
                            currentPath = currentPath.slice(0, index + 1);
                            updatePathDisplay();
                            updateFolderList();
                        }
                    });
                });
            }

                    // Add event listeners
                    folderItem.addEventListener('click', function() {

                        }

                        selectedFolder = this;

                    folderItem.addEventListener('dblclick', function() {

                // Check if folder already exists
                const existingFolders = Array.from(folderList.querySelectorAll('.folder-name'))
                    .map(el => el.textContent);
                
                if (existingFolders.includes(folderName)) {
                    showStatus('A folder with this name already exists', 'error');
                    return;
                }

                path.setAttribute('fill', '#020817');
                
                svg.appendChild(path);
                folderIcon.appendChild(svg);
                
                const folderNameEl = document.createElement('div');
                folderNameEl.className = 'folder-name';
                folderNameEl.textContent = folderName;
                
                folderItem.appendChild(folderIcon);
                folderItem.appendChild(folderNameEl);
                
                // Add to the top of the list
                folderList.insertBefore(folderItem, folderList.firstChild);
                
                // Add event listeners
                folderItem.addEventListener('click', function() {
                    if (selectedFolder) {
                        selectedFolder.classList.remove('selected');
                    }
                    
                    this.classList.add('selected');
                    selectedFolder = this;
                    copyBtn.disabled = false;
                });
                
                folderItem.addEventListener('dblclick', function() {
                    const folderName = this.getAttribute('data-folder');
                    navigateToFolder(folderName);
                });
                
                // Auto-select the new folder
                folderItem.click();
                
                hideNewFolderUI();
                showStatus(`Folder "${folderName}" created successfully`, 'success');
            }
            
            function hideNewFolderUI() {
                newFolderInput.style.display = 'none';
                newFolderActions.style.display = 'none';
                newFolderInput.value = '';
            }
            
            function showStatus(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = `status-message status-${type}`;
                statusMessage.style.display = 'block';
                
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 3000);
            }
        });

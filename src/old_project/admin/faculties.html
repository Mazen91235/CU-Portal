  <script>
    document.addEventListener('DOMContentLoaded', async () => {

      const facultiesGrid = document.querySelector('.row.g-4');
      let faculties = [];
      let editingCard = null;
      const API_BASE = `${domain}/admin/faculties`;

      // --- Fetch and render faculties from backend ---
      async function fetchFaculties() {
        showLoading();
        const res = await getFaculties();
        if (res?.status === 'success') {
          faculties = res.data;
          renderFaculties();
        }
      }

      function renderFaculties() {
        facultiesGrid.innerHTML = '';
        faculties.forEach((faculty, idx) => {
          const col = document.createElement('div');
          col.className = 'col-lg-4 col-md-6 col-12';
          col.innerHTML = `
        <div class="faculty-card">
          <div class="faculty-logo-circle default-bg">
            <img src="../assets/university.png" alt="University Logo">
          </div>
          <h2 class="faculty-name">${faculty.name}</h2>
          <div class="faculty-actions">
            <button class="btn edit-btn" data-idx="${idx}">Edit</button>
            <button class="btn btn-danger delete-btn" data-idx="${idx}"> Delete</button>
          </div>
        </div>
      `;
          facultiesGrid.appendChild(col);
          hideLoading();
        });
      }

      // --- Search filter ---
      document.querySelector('.faculties-search-input').addEventListener('input', e => {
        const query = e.target.value.toLowerCase();
        document.querySelectorAll('.faculty-card').forEach(card => {
          const name = card.querySelector('.faculty-name').textContent.toLowerCase();
          card.parentElement.style.display = name.includes(query) ? '' : 'none';
        });
      });

      // --- Show/Hide Popups ---
      function showCustomPopup(overlayId, inputId, initialValue = '') {
        const overlay = document.getElementById(overlayId); // ✅ real element
        if (overlay) {
          overlay.style.display = 'flex' ;
        }
        const input = document.getElementById(inputId);
        input.value = initialValue;
        setTimeout(() => input.focus(), 100);
        overlay.onclick = e => {
          if (e.target === overlay) {
            hidePopups();
          }

        };

      }
      function hidePopups() {
        document.querySelectorAll('.popup-overlay').forEach(overlay => overlay.style.display = 'none');
      }
      document.onclick = e => { if (e.target === document.querySelector('.popup-overlay')) hidePopups(); };
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          const anyVisible = [...document.querySelectorAll('.popup-overlay')]
            .some(overlay => overlay.style.display !== 'none');
          if (anyVisible) hidePopups();
        }
      });

      // --- Add Faculty ---
      document.getElementById('addFacultyBtn').onclick = async e => {
        e.preventDefault();
        showLoading();
        const name = document.getElementById('addFacultyInput').value.trim();
        if (!name) return;

        const res = await addFaculty(name);
        if (res?.status === 'success') {
          faculties.push(res.data);
          renderFaculties();
          hidePopups();
        }
        hideLoading();
      };
      // --- Show Add Faculty popup ---
      document.querySelectorAll('.add-faculties-btn, .add-faculties-btn-mobile, .add-faculties-btn-desktop').forEach(btn => {
        btn.addEventListener('click', function () {
          // Clear input field when opening
          document.getElementById('addFacultyInput').value = '';
          showCustomPopup('addFacultyOverlay', 'addFacultyInput'); // <<<<< 
        });
      });

      // --- Edit/Delete Faculty via Event Delegation ---
      facultiesGrid.addEventListener('click', async e => {
        const editBtn = e.target.closest('.edit-btn');
        const deleteBtn = e.target.closest('.delete-btn');

        if (editBtn) {
          const idx = parseInt(editBtn.getAttribute('data-idx'));
          editingCard = faculties[idx];
          showCustomPopup('editFacultyOverlay', 'editFacultyInput', faculties[idx].name);
          return;
        }

        if (deleteBtn) {
          const idx = parseInt(deleteBtn.getAttribute('data-idx'));
          const faculty = faculties[idx];

          showPopup(
            'confirm',
            'Delete Faculty',
            `Are you sure you want to delete "${faculty.name}"?`,
            async () => {
              showLoading();
              try {
                const res = await deleteFaculty(faculty.id || faculty._id);

                if (res?.status === 'success') {
                  faculties.splice(idx, 1); // remove from array
                  renderFaculties(); // re-render list
                  showToast("success", "Deleted", "Faculty deleted successfully", "");
                } else {
                  showToast("error", "Error", res?.message || "Failed to delete faculty", "");
                }
              } catch (err) {
                showToast("error", "Error", err.message || "Failed to delete faculty", "");
              } finally {
                hideLoading();
                closePopup();
              }
            }
          );

          return;
        }

      });


      // --- Edit Faculty Form Submit ---
      document.getElementById('editFacultyBtn').onclick = async e => {
        e.preventDefault();
        showLoading();

        const newName = document.getElementById('editFacultyInput').value.trim();
        if (!editingCard || !newName) return;

        const res = await editFaculty(editingCard.id || editingCard._id, newName);
        if (res?.status === 'success') {
          const idx = faculties.findIndex(f => (f.id || f._id) === (editingCard.id || editingCard._id));
          faculties[idx].name = newName;
          renderFaculties();
          hidePopups();

        }
        hideLoading();
      };

      // --- Initial fetch ---
      await fetchFaculties();

    });

  </script>

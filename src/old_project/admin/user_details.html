    <style>
      .custom-filter-container {
        position: relative;
        width: 220px;
        font-family: "Roboto", Arial, sans-serif;
        margin-right: 16px;
        display: inline-block;
        vertical-align: top;
      }
      .admin-badge {
        background: #e0edff;
        color: #2563eb;
        border-radius: 8px;
        padding: 6px 18px;
        font-size: 15px;
        font-weight: 500;
        display: inline-block;
      }
      .custom-filter {
        display: flex;
        align-items: center;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        height: 48px;
        cursor: pointer;
        padding: 0 16px 0 0;
        min-width: 180px;
        box-shadow: 0 2px 8px rgba(80, 14, 88, 0.04);
        position: relative;
        z-index: 999;
        transition: box-shadow 0.15s, border-color 0.15s;
      }

      .custom-filter:hover,
      .custom-filter.open {
        border-color: #7b1684 !important;
        box-shadow: 0 0 0 2px #7b168433;
      }

      .pending-pagination-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #fff;
        border-radius: 24px;
        padding: 8px 24px;
        display: inline-flex;
        gap: 16px;
        justify-content: center;
        align-items: center;
        box-shadow: 0 2px 8px rgba(80, 14, 88, 0.12);
        text-align: center;
      }
      .pending-page-btn {
        background: transparent;
        color: #7b1684;
        border: none;
        border-radius: 50%;
        padding: 8px 16px;
        margin: 0;
        cursor: pointer;
        font-weight: 600;
        font-size: 18px;
        position: relative;
        width: 40px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.3s ease;
      }
      .pending-page-btn.active {
        background: #fff;
        color: #7b1684;
        font-weight: 700;
      }
      .pending-page-btn.active::after {
        content: "";
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
        background-color: #7b1684;
        border-radius: 50%;
      }
      .pending-page-btn:hover {
        background: #f3e6f9;
        color: #7b1684;
      }
      #edit-role-btn {
        background: #800080 !important;
        color: white;
      }
      #update-role-btn {
        background: #800080 !important;
        border: 0;
      }
      /* Add violet border to search input container on hover/focus-within */
      .um-filter-search {
        transition: box-shadow 0.15s, border-color 0.15s;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        display: flex;
        align-items: center;
        padding-left: 10px;
        height: 48px;
      }

      .um-filter-search:hover,
      .um-filter-search:focus-within {
        border-color: #7b1684 !important;
        box-shadow: 0 0 0 2px #7b168433;
      }

      .um-filter-search input {
        border: none;
        background: transparent;
        outline: none;
        flex: 1;
        height: 100%;
        padding-left: 8px;
        font-size: 15px;
      }

      .custom-filter-label-value {
        display: flex;
        flex-direction: column;
        margin-left: 30px;
        margin-top: 4px;
        flex: 1 1 0;
        min-width: 0;
      }

      .custom-filter-label {
        color: #64748b;
        font-size: 13px;
        /* decreased font size */
        font-weight: 400;
        margin-bottom: 0.5px;
        text-align: left;
        letter-spacing: 0.01em;
      }

      .custom-filter-value {
        color: #22223b;
        font-size: 13px;
        /* decreased font size */
        font-weight: 500;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .custom-filter-arrow {
        margin-left: 16px;
        margin-right: 8px;
        transition: transform 0.2s;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .custom-filter.open .custom-filter-arrow {
        transform: rotate(180deg);
      }

      /* Fix: prevent dropdown from being clipped by parent section */
      .um-filters-section {
        overflow: visible !important;
      }

      .custom-dropdown-list {
        position: absolute;
        left: 0;

        top: 100%;
        width: 100%;
        background: #fff;
        border: 1px solid #7b1684;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(80, 14, 88, 0.08);
        z-index: 99999;
        margin-top: 4px;
        padding: 0;
        list-style: none;
        display: none;
        max-height: 220px;
        overflow-y: auto;
        overflow-x: hidden;
        font-size: 16px;
        /* Add this to ensure dropdown is rendered above other elements */
        /* No change needed here for clipping, just ensure parent is not overflow:hidden */
      }

      .custom-filter.open + .custom-dropdown-list {
        display: block;
      }

      .custom-dropdown-list li {
        padding: 14px 0 14px 14px;
        /* Remove left/right padding */

        margin: 0;
        cursor: pointer;
        color: #374151;
        overflow: hidden;
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
      }

      .custom-dropdown-list li:hover,
      .custom-dropdown-list li.active {
        background: #f3f3f3;
        color: #7b1684;
        font-weight: 500;
        /* Ensure full width highlight */
        width: 100% !important;
        box-sizing: border-box;
      }

      /* Responsive filters: column layout for < 1340px */
      @media (max-width: 1340px) {
        .um-filters-row {
          flex-direction: column !important;
          align-items: stretch !important;
          gap: 0 !important;
          width: 100%;
          display: flex;
        }

        .um-filter-search {
          width: 100% !important;
          margin-bottom: 16px !important;
          /* Equal vertical space */
          height: 48px !important;
          min-height: 48px !important;
          box-sizing: border-box;
        }

        .um-filters-group {
          flex-direction: column !important;
          width: 100% !important;
          display: flex;
          gap: 16px !important;
          /* Equal vertical space between filters */
        }

        .custom-filter-container {
          width: 100% !important;
          min-width: 0 !important;
          margin-right: 0 !important;
        }

        .custom-filter {
          width: 100% !important;
          min-width: 0 !important;
          height: 48px !important;
          min-height: 48px !important;
          box-sizing: border-box;
        }
      }
    </style>

    <script>
      function transformUserDetailsTable() {
        const table = document.querySelector(".user-details-info-table");
        if (!table) return;

        // Center the table in its wrapper
        table.style.margin = "auto"; // Add left margin
        table.style.display = "table";
        table.style.width = "100%";
        table.style.maxWidth = "600px";
        table.style.fontFamily = "Poppins, Arial, sans-serif";
        table.style.fontSize =
          window.innerWidth <= 600
            ? "13px"
            : window.innerWidth <= 500
            ? "15px"
            : "16px";
        table.style.transition = "font-size 0.2s, width 0.2s";

        // Set minimum padding and margin for all table cells
        Array.from(table.querySelectorAll("td")).forEach((td) => {
          td.style.padding = "2px 2px";
          td.style.margin = "0";
          td.style.fontFamily = "inherit";
          td.style.fontSize = "inherit";
        });

        // Only transform if mobile view
        if (window.innerWidth <= 1200) {
          // If already transformed, skip
          if (table.dataset.mobileTransformed === "true") return;

          // Gather all icons and labels/values
          const rows = Array.from(table.querySelectorAll("tr"));
          const items = [
            {
              icon: "../assets/usericon.png",
              label: "Name:",
              value: document.getElementById("user_name_value").textContent,
              valueId: "user_name_value",
            },
            {
              icon: "../assets/mailicon.png",
              label: "E-Mail:",
              value: document.getElementById("user_email_value").textContent,
              valueId: "user_email_value",
            },
            {
              icon: "../assets/callicon.png",
              label: "Phone:",
              value: document.getElementById("user_phone_value").textContent,
              valueId: "user_phone_value",
            },
            {
              icon: "../assets/building.png",
              label: "Faculty:",
              value: document.getElementById("user_faculty_value").textContent,
              valueId: "user_faculty_value",
            },
            {
              icon: "../assets/building2.png",
              label: "Department:",
              value: document.getElementById("user_department_value")
                .textContent,
              valueId: "user_department_value",
            },
            {
              icon: "../assets/certificateicon.png",
              label: "Academic Year:",
              value: document.getElementById("user_year_value").textContent,
              valueId: "user_year_value",
            },
            {
              icon: "../assets/id-card.png",
              label: "National ID:",
              value: document.getElementById("user_national_id_value")
                .textContent,
              valueId: "user_national_id_value",
            },
          ];

          // Clear table and rebuild as 2 columns
          table.innerHTML = "";
          items.forEach((item) => {
            const tr = document.createElement("tr");
            const iconLabelTd = document.createElement("td");
            iconLabelTd.className = "user-details-label";
            iconLabelTd.innerHTML = `<img src="${item.icon}" alt="${item.label} Icon" /> ${item.label}`;
            iconLabelTd.style.padding = "2px 4px";
            iconLabelTd.style.margin = "0";
            iconLabelTd.style.fontFamily = "inherit";
            iconLabelTd.style.fontSize = "inherit";

            const valueTd = document.createElement("td");
            valueTd.className = "user-details-value";
            valueTd.id = item.valueId;
            valueTd.textContent = item.value;
            valueTd.style.padding = "2px 4px";
            valueTd.style.margin = "0";
            valueTd.style.fontFamily = "inherit";
            valueTd.style.fontSize = "inherit";

            tr.appendChild(iconLabelTd);
            tr.appendChild(valueTd);
            table.appendChild(tr);
          });
          table.dataset.mobileTransformed = "true";
        } else {
          // Restore desktop table if needed
          if (table.dataset.mobileTransformed === "true") {
            location.reload();
          }
        }
      }

      // Run on load and resize
      window.addEventListener("DOMContentLoaded", transformUserDetailsTable);
      window.addEventListener("resize", transformUserDetailsTable);
    </script>

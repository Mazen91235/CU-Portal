<script>
if (document.getElementById('faculty_hidden')) {

  document.getElementById('date_from_hidden').id = 'dateFromFilter';
}
if (document.getElementById('date_to_hidden')) {
  document.getElementById('date_to_hidden').id = 'dateToFilter';
}
// Add dateFilter for combined date
const dateFilter = document.createElement('input');
dateFilter.type = 'hidden';
dateFilter.id = 'dateFilter';
dateFilter.value = '';
document.body.appendChild(dateFilter);

// Setup custom dropdowns for faculty and dates
function setupCustomDropdown(filterId, dropdownId, valueId, hiddenId) {
  const filter = document.getElementById(filterId);
  const dropdown = document.getElementById(dropdownId);
  const valueSpan = document.getElementById(valueId);
  const hiddenInput = document.getElementById(hiddenId);
  const arrow = filter.querySelector('.custom-filter-arrow svg');

  filter.addEventListener('click', function (e) {
    document.querySelectorAll('.custom-filter').forEach(f => {
      if (f !== filter) {
        f.classList.remove('open');
        const otherArrow = f.querySelector('.custom-filter-arrow svg');
        if (otherArrow) otherArrow.style.transform = '';
      }
    });
    document.querySelectorAll('.custom-dropdown-list').forEach(d => {
      if (d !== dropdown) d.style.display = 'none';
    });

    filter.classList.toggle('open');
    dropdown.style.display = filter.classList.contains('open') ? 'block' : 'none';
    if (arrow) {
      arrow.style.transition = 'transform 0.2s';
      arrow.style.transform = filter.classList.contains('open') ? 'rotate(180deg)' : '';
    }
    e.stopPropagation();
  });

  dropdown.addEventListener('mousedown', function (e) {
    if (e.target.tagName === 'LI') {
      dropdown.querySelectorAll('li').forEach(li => li.classList.remove('active'));
      e.target.classList.add('active');

      valueSpan.textContent = e.target.textContent;
      hiddenInput.value = e.target.dataset.value;
      filter.classList.remove('open');
      dropdown.style.display = 'none';
      if (arrow) arrow.style.transform = '';
      handleFilterChange();
    }
  });
}

setupCustomDropdown('customTypeFilter','customTypeDropdown','customTypeValue','type_hidden');
setupCustomDropdown('customActionFilter','customActionDropdown','customActionValue','action_hidden');
setupCustomDropdown('customEntityFilter','customEntityDropdown','customEntityValue','entity_hidden');

document.addEventListener('click', function () {
  document.querySelectorAll('.custom-filter').forEach(f => {
    f.classList.remove('open');
    const arrow = f.querySelector('.custom-filter-arrow svg');
    if (arrow) arrow.style.transform = '';
  });
  document.querySelectorAll('.custom-dropdown-list').forEach(d => d.style.display = 'none');
});

document.addEventListener('DOMContentLoaded', function() {
  var calendarEl = document.getElementById('calendar');
  if (!calendarEl) return;

  var calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    height: 600,
    events: async function(fetchInfo, successCallback, failureCallback) {
      try {
        successCallback(events);
      } catch (error) {
        failureCallback(error);
      }
    }
  });
  calendar.render();
});

</script>

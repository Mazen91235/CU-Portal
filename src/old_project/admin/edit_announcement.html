<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Announcement</title>
  <link rel="stylesheet" href="../css/add_announcement.css">

  <link rel="stylesheet" href="../css/tasks-add.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">


  <style>
    .attachments-section .form-label {
      font-weight: 600;
      font-size: 1.08rem;
      margin-bottom: 18px;
      margin-top: 30px;
    }

    .attachments-section .attached-links-header-row {
      margin-bottom: 18px;
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #uploadedFilesSection .form-label {
      font-weight: 600;
      font-size: 1.08rem;
      margin-bottom: 18px;
      margin-top: 18px;
    }

    .uploaded-file-item {
      background: #ea7df4;
      width: 100% !important;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      /* Remove any max-width or margin-right that could restrict width */
      box-sizing: border-box;
      min-width: 150px;
    }

    .uploaded-file-name {
      color: #22223B;
      font-weight: 500;
      font-size: 1rem;
      display: flex;
      align-items: center;
    }

    .remove-upload-btn {
      background: none;
      border: none;
      color: #000;
      font-size: 1.2rem;
      cursor: pointer;
      margin-left: 12px;
    }

    .btn-outline-secondary.btn-sm.mt-2.choose-files-btn {
      transition: background 0.18s, color 0.18s;
    }

    .btn-outline-secondary.btn-sm.mt-2.choose-files-btn:hover {
      background: #7B1684 !important;
      color: #fff !important;
      border-color: #7B1684 !important;
    }

    .form-action-btns {
      gap: 0.5rem;
    }

    .btn-cancel {
      background: #f8f8fa;
      color: #22223B;
      border: 1px solid #ede9f3;
      border-radius: 14px;
      font-weight: 500;
      padding: 10px 24px;
      box-shadow: 0 2px 8px rgba(80, 14, 88, 0.04);
      transition: background 0.18s, color 0.18s;
    }

    .btn-cancel:hover {
      background: #ede9f3;
    }

    .btn-create-announcement {
      background: #6B187A;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      padding: 10px 32px;
      box-shadow: 0 2px 8px rgba(80, 14, 88, 0.04);
      display: flex;
      align-items: center;
      font-size: 1rem;
      transition: background 0.18s, color 0.18s;
    }

    .btn-create-announcement:hover {
      background: #7B1684;
    }

    @media (max-width: 600px) {
      .form-action-btns {
        flex-direction: column;
        align-items: center !important;
        gap: 12px;
        width: 100%;
      }

      .btn-create-announcement,
      .btn-cancel {
        width: 100%;
        margin-right: 0 !important;
        margin-left: 0 !important;
        justify-content: center;
        display: flex;
      }

      .btn-create-announcement {
        margin-bottom: 8px;
        order: 1;
      }

      .btn-cancel {
        order: 2;
      }
    }
  </style>
</head>

<body style="background-color: rgb(248, 250, 252);">
  <div id="sidebar-container"></div>
  <div id="content-wrapper" class="sidebar-hidden">
    <div id="navbar-container" class="fixed-top"></div>

    <!-- Banner Section -->
    <section class="banner-section" style="margin-top:72px;">
      <div style="display: flex; align-items: center;">

        <div>
          <div class="banner-title" style="display: flex; align-items: center;">
            <img src="../assets/ann3.png" alt="Task Icon" style="margin-right: 12px; width: 32px; height: 32px;">
            Edit Announcement
          </div>
          <div class="banner-desc">
            Fill in the details to update your announcements </div>
        </div>
      </div>
    </section>
    <!-- End Banner Section -->

    <!-- Main Form Section -->
    <section class="form-section">
      <form class="form-card" id="announcementForm">
        <!-- Basic Information -->
        <div class="form-section-card">
          <div class="form-section-header">
            <img src="../assets/exam2.png" alt="Exam Icon" style="margin-right: 8px; width: 20px; height: 20px;">
            <span>Basic Information</span>
          </div>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="announcementTitle" placeholder="Enter Announcement Title"
                name="title">
            </div>
            <div class="col-12">
              <label class="form-label">Content <span class="text-danger">*</span></label>
              <textarea class="form-control" rows="2" id="content"
                placeholder="Brief description of the announcement content..." name="content"></textarea>
            </div>


            <div class="mb-3 col-12">
              <label for="subject" class="form-label">Subject</label>
              <div class="custom-filter-container">
                <div class="custom-filter" id="customSubjectFilter">
                  <div class="custom-filter-label-value">
                    <span class="custom-filter-value" id="customSubjectValue">All Subjects</span>
                  </div>
                  <span class="custom-filter-arrow">
                    <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
                      <path d="M9 13L16 20L23 13" stroke="rgb(173, 173, 173)" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    </svg>
                  </span>
                </div>
                <ul class="custom-dropdown-list" id="customSubjectDropdown" style="padding-top: 0;">
                  <input type="text" id="subjectSearchInput" value="" placeholder="Search..."
                    style="width:100%;box-sizing:border-box;padding:8px 12px;border:none;outline:none;border-bottom:1px solid #e5e7eb;">
                  <li class="active" data-value="">All Subjects</li>
                  <li data-value="ds">Data Structures</li>
                  <li data-value="algo">Algorithms</li>
                  <li data-value="db">Database Systems</li>
                  <li data-value="web">Web Development</li>
                  <li data-value="ai">Artificial Intelligence</li>
                </ul>
                <script>
                  // Subject dropdown search filter
                  document.getElementById('subjectSearchInput').addEventListener('input', function () {
                    const query = this.value.trim().toLowerCase();
                    const dropdown = document.getElementById('customSubjectDropdown');
                    dropdown.querySelectorAll('li').forEach(li => {
                      if (!query || li.textContent.toLowerCase().includes(query)) {
                        li.style.display = '';
                      } else {
                        li.style.display = 'none';
                      }
                    });
                  });
                </script>
                <input type="hidden" name="subject" id="subject_hidden" value="">
              </div>
            </div>
            <!-- Attachments & Links Section -->
            <div class="attachments-section mb-3">
              <h3><i class="fa fa-paperclip" style="margin-right:8px;"></i>Attachments & Links</h3>
              <label class="form-label">Attached Files</label>
              <div class="file-drop mb-2" id="fileDropArea">
                <i class="fa fa-upload" style="font-size: 1.5rem; margin-bottom: 8px;"></i><br>
                <span>Drag &amp; drop files here, or click to browse</span><br>
                <input type="file" multiple style="display:none;" id="fileInput">
                <button type="button" class="btn btn-outline-secondary btn-sm mt-2"
                  onclick="document.getElementById('fileInput').click();">Choose Files</button>
              </div>
              <div class="uploaded-files-list" id="uploadedFilesList"></div>
              <!-- Attached Links Section -->
              <div class="attached-links-header-row">
                <label class="form-label mb-0">Attached Links</label>
                <button type="button" class="add-link-btn" id="addLinkBtn">
                  <i class="fa fa-plus" style="margin-right:4px;"></i>Add Link
                </button>
              </div>
              <div class="attached-links-list" id="attachedLinksList">
                <div class="attached-links-row submission-links-row mb-2">
                  <input type="text" class="form-control attached-link-title submission-link-title"
                    placeholder="Link title" style="background-color: white;">
                  <input type="url" class="form-control attached-link-url submission-link-url" placeholder="https://"
                    style="background-color: white;">
                  <button type="button" class="remove-link-btn" tabindex="-1">
                    <i class="fa fa-times"></i>
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
        <!-- Action Buttons -->
        <div class="form-action-btns d-flex justify-content-end align-items-end flex-wrap" style="margin-top:32px;">
          <button type="button" class="btn btn-cancel me-3">Cancel</button>
          <button type="submit" class="btn btn-create-announcement">
            <i class="fa fa-floppy-disk" style="margin-right:8px;"></i> update announcements
          </button>
        </div>
  </div>
  <div id="toast-container"></div>
  <div id="popup-container"></div>
  <div id="loadingOverlayContainer" class="d-none w-full h-full"
    style="width: 100vw; height: 100vh; top: 0; left: 0; position: fixed;z-index: 999999999999;"></div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"></script>
  <script src="../js/loading.js"></script>
  <script src="../js/loadscreen.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/admin_announcements.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const announcementId = urlParams.get("id");
    let announcement;
    async function fetchAnnouncement() {
      showLoading();
      const res = await getAnnouncement(announcementId);
      if (res?.status === 'success') {
        announcement = res.data;
        loadAnnouncData(announcement);
      }
      else {
        showToast("error", "Error", "Failed to fetch Announcement", "");

      }
    }



    function loadAnnouncData(announcement) {
      document.getElementById("announcementTitle").value = announcement.title || "";
      document.getElementById("content").value = announcement.content || "";

      // subject
      const valueSpan = document.getElementById("customSubjectValue");
      const hiddenInput = document.getElementById("subject_hidden");
      if (announcement.subject) {
        valueSpan.textContent = announcement.subject.name;
        hiddenInput.value = announcement.subject.id;
      }


      // attached links
      const attachedLinksList = document.getElementById("attachedLinksList");
      attachedLinksList.innerHTML = ""; // clear existing row
      if (announcement.links) {
        announcement.links.forEach(link => {
          const newRow = createLinkRow(link.title, link.url);
          attachedLinksList.appendChild(newRow);
        });
      }

      // uploaded files (existing)
      uploadedFiles = [];
      const uploadedFilesList = document.getElementById("uploadedFilesList");
      uploadedFilesList.innerHTML = "";

      // files_data is already an array of objects
      if (Array.isArray(announcement.details.files_data)) {
        announcement.details.files_data.forEach((file, idx) => {
          const item = document.createElement("div");
          item.className = "uploaded-file-item mb-2";
          item.innerHTML = `
    
      <span class="uploaded-file-name" title="${file.name}"><a href="${file.webViewLink}" target="_blank" style="text-decoration:none; color:inherit;" >${file.name}</a></span>      

            <button type="button" class="remove-upload-btn btn btn-sm btn-danger ms-2" 
                    aria-label="Remove file" onclick="removeUploadedFile(${idx})">
                <i class="fa fa-times"></i>
            </button>
    `;
          uploadedFilesList.appendChild(item);

          // keep track of them if needed
          uploadedFiles.push(file);
        });
      }

    }



























    // File upload preview and remove logic
    const fileInput = document.getElementById('fileInput');
    const uploadedFilesList = document.getElementById('uploadedFilesList');
    let uploadedFiles = [];

    fileInput.addEventListener('change', function () {
      for (const file of fileInput.files) {
        if (!uploadedFiles.some(f => f.name === file.name && f.size === file.size)) {
          uploadedFiles.push(file);
        }
      }
      renderUploadedFiles();
      // Reset input so same file can be re-added if removed
      fileInput.value = '';
    });

    function renderUploadedFiles() {
      uploadedFilesList.innerHTML = '';
      uploadedFiles.forEach((file, idx) => {
        const item = document.createElement('div');
        item.className = 'uploaded-file-item mb-2';
        item.innerHTML = `
           
            <span class="uploaded-file-name" title="${file.name}">${file.name}</span>
            <button type="button" class="remove-upload-btn btn btn-sm btn-danger ms-2" 
                    aria-label="Remove file" onclick="removeUploadedFile(${idx})">
                <i class="fa fa-times"></i>
            </button>
        `;
        uploadedFilesList.appendChild(item);
      });
    }


    window.removeUploadedFile = function (idx) {
      uploadedFiles.splice(idx, 1);
      renderUploadedFiles();
    };

    // Optional: Drag & drop support
    const fileDropArea = document.getElementById('fileDropArea');
    fileDropArea.addEventListener('dragover', e => {
      e.preventDefault();
      fileDropArea.style.borderColor = '#7b2ff2';
    });
    fileDropArea.addEventListener('dragleave', e => {
      fileDropArea.style.borderColor = '#d1c4e9';
    });
    fileDropArea.addEventListener('drop', e => {
      e.preventDefault();
      fileDropArea.style.borderColor = '#d1c4e9';
      const files = Array.from(e.dataTransfer.files);
      for (const file of files) {
        if (!uploadedFiles.some(f => f.name === file.name && f.size === file.size)) {
          uploadedFiles.push(file);
        }
      }
      renderUploadedFiles();
    });

    // Link add/remove logic
    const attachedLinksList = document.getElementById('attachedLinksList');
    const addLinkBtn = document.getElementById('addLinkBtn');

    function createLinkRow(title = '', url = '') {
      const row = document.createElement('div');
      row.className = 'attached-links-row submission-links-row mb-2';
      row.innerHTML = `
                <input type="text" class="form-control attached-link-title submission-link-title" placeholder="Link title" value="${title}">
                <input type="url" class="form-control attached-link-url submission-link-url" placeholder="https://" value="${url}">
                <button type="button" class="remove-link-btn" tabindex="-1">
                    <i class="fa fa-times"></i>
                </button>
            `;
      // Remove button logic
      row.querySelector('.remove-link-btn').onclick = function () {
        row.remove();
      };
      return row;
    }

    addLinkBtn.onclick = function () {
      const newRow = createLinkRow();
      attachedLinksList.appendChild(newRow);
    };



    (function () {
      const filter = document.getElementById('customSubjectFilter');
      const dropdown = document.getElementById('customSubjectDropdown');
      const valueSpan = document.getElementById('customSubjectValue');
      const hiddenInput = document.getElementById('subject_hidden');

      filter.addEventListener('click', function (e) {
        filter.classList.toggle('open');
        dropdown.style.display = filter.classList.contains('open') ? 'block' : 'none';
        e.stopPropagation();
      });

      dropdown.addEventListener('mousedown', function (e) {
        if (e.target.tagName === 'LI') {
          dropdown.querySelectorAll('li').forEach(li => li.classList.remove('active'));
          e.target.classList.add('active');
          valueSpan.textContent = e.target.textContent;
          hiddenInput.value = e.target.getAttribute('data-value');
          filter.classList.remove('open');
          dropdown.style.display = 'none';
        }
      });

      document.addEventListener('click', function (e) {
        if (!filter.contains(e.target) && !dropdown.contains(e.target)) {
          filter.classList.remove('open');
          dropdown.style.display = 'none';
        }
      });
    })();
    async function loadCourses() {
      const courseDropdown = document.getElementById("customSubjectDropdown");
      const searchInput = document.getElementById("subjectSearchInput");
      const valueSpan = document.getElementById("customSubjectValue");
      const hiddenInput = document.getElementById("subject_hidden");

      try {
        const res = await searchCourses();

        // keep only the search input, remove old <li>
        courseDropdown.querySelectorAll("li").forEach(li => li.remove());

        // Add "All Courses" first
        const allLi = document.createElement("li");
        allLi.classList.add("active");
        allLi.dataset.value = "";
        allLi.textContent = "All Courses";
        courseDropdown.appendChild(allLi);

        // Add courses dynamically
        if (res?.data) {

          res.data.forEach(course => {

            const li = document.createElement("li");
            li.dataset.value = course.id;
            li.textContent = course.name;
            courseDropdown.appendChild(li);
          });
        }

        // Attach click events
        courseDropdown.querySelectorAll("li").forEach(li => {
          li.addEventListener("click", () => {
            valueSpan.textContent = li.textContent;
            hiddenInput.value = li.dataset.value;
            courseDropdown.classList.remove("show");
          });
        });

        // search filter (reuse existing input)
        searchInput.addEventListener("input", function () {
          const query = this.value.trim().toLowerCase();
          courseDropdown.querySelectorAll("li").forEach(li => {
            if (!query || li.textContent.toLowerCase().includes(query)) {
              li.style.display = "";
            } else {
              li.style.display = "none";
            }
          });
        });
        hideLoading();

      } catch (error) {
        console.error("Error loading courses:", error);
        hideLoading();
        showToast("error", "Error", "Could not load courses", "");
      }
    }



    document.querySelector(".form-card").addEventListener("submit", async function (e) {
      e.preventDefault();
      showLoading();
      const title = document.getElementById("announcementTitle").value.trim();
      const content = document.getElementById("content").value.trim();



      const subject_id = document.getElementById("subject_hidden").value;

      // collect links as "title|url, title|url"
      const linksArr = [];
      let links = "";
      document.querySelectorAll(".submission-links-row").forEach(row => {
        const t = row.querySelector(".submission-link-title").value.trim();
        const u = row.querySelector(".submission-link-url").value.trim();
        if (t && u) linksArr.push(`${t}|${u}`);
        links = linksArr.join(", ");

      });


      const urlsArr = [];

      for (let idx = 0; idx < uploadedFiles.length; idx++) {
        const row = document.querySelectorAll('#uploadedFilesList .uploaded-file-item')[idx];
        const file = uploadedFiles[idx];

        try {
          const url = await UploadToDrive(file); // wait for upload
          if (!url) {
            hideLoading();
            showToast("error", "File Upload Failed", "File upload failed. Please try again.", "");
            continue; // skip this file
          }

          if (title && file) {
            urlsArr.push(`${url}`);
          }
        } catch (err) {
          hideLoading();
          showToast("error", "Error", `Failed to upload ${file.name}`, "");
        }
      }

      const urls = urlsArr.join(", ");

      await editAnnouncement(announcementId, title, content, subject_id, urls, links);
      hideLoading();
    });




















    document.addEventListener("DOMContentLoaded", async () => {
      showLoading();
      await fetchAnnouncement();
      await loadCourses();
    });

  </script>

</body>

</html>

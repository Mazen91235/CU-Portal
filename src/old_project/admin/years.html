    .um-title-content {
      font-family: "Roboto", sans-serif;
    }
    /* --- Popup Dropdown Fix --- */
    .custom-filter-container {
      position: relative;
      display: inline-block;
    }

    .custom-filter {
      cursor: pointer;
      user-select: none;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 8px 16px;
      min-width: 180px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .custom-dropdown-list {
      display: none;
      position: absolute;
      top: 110%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      z-index: 1000;
      margin: 0;
      padding: 0;
      list-style: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .custom-filter.open+.custom-dropdown-list,
    .custom-dropdown-list.open {
      display: block;
    }

    .custom-dropdown-list li {
      padding: 10px 16px;
      cursor: pointer;
    }

    .custom-dropdown-list li.active,
    .custom-dropdown-list li:hover {
      background: #f0f0f0;
    }

    /* Custom Year Popup Modal */
    #yearPopupOverlay {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      background: rgba(60, 60, 60, 0.6);
    }

    #yearPopupModal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 22px;
      padding: 32px 28px 28px 28px;
      min-width: 320px;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    #yearPopupModal h2 {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 22px;
      background: linear-gradient(90deg,#520E58,  #7B1684);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #yearPopupInput {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #d09adf;
      border-radius: 8px;
      font-size: 1.1rem;
      margin-bottom: 24px;
      outline: none;
      transition: border 0.2s;
    }

    #yearPopupInput:focus {
      border-color: #7B1684;
      box-shadow: 0 0 0 2px #7B168433;
    }

    #yearPopupSaveBtn {
      width: 100%;
      background: #7B1684;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 0;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }

    #yearPopupSaveBtn:hover {
      background: linear-gradient(90deg,#520E58, #7B1684);
    }
  </style>
</head>

    <script>
      // --- Custom Dropdown Logic for Year Filter ---
      document.addEventListener('DOMContentLoaded', async function () {
        const yearPopupOverlay = document.getElementById('yearPopupOverlay');
        const yearPopupTitle = document.getElementById('yearPopupTitle');
        const yearPopupInput = document.getElementById('yearPopupInput');
        const yearPopupSaveBtn = document.getElementById('yearPopupSaveBtn');
        const yearPopupForm = document.getElementById('yearPopupForm');
        const yearsCardsGrid = document.getElementById('yearsCardsGrid');

        let years = []; // fetched from API
        let editingYearIndex = null;

        // --- Custom Dropdown Logic ---
        function setupCustomDropdown(filterId, dropdownId, valueId, hiddenId) {
          const filter = document.getElementById(filterId);
          const dropdown = document.getElementById(dropdownId);
          const valueSpan = document.getElementById(valueId);
          const hiddenInput = document.getElementById(hiddenId);

          filter.addEventListener('click', e => {
            e.stopPropagation();
            document.querySelectorAll('.custom-filter.open').forEach(f => {
              if (f !== filter) f.classList.remove('open');
            });
            filter.classList.toggle('open');
            dropdown.classList.toggle('open', filter.classList.contains('open'));
          });

          dropdown.addEventListener('click', e => {
            const li = e.target.closest('li');
            if (!li) return;
            dropdown.querySelectorAll('li').forEach(item => item.classList.remove('active'));
            li.classList.add('active');
            valueSpan.textContent = li.textContent;
            hiddenInput.value = li.getAttribute('data-value');
            filter.classList.remove('open');
            dropdown.classList.remove('open');
            hiddenInput.dispatchEvent(new Event('change'));
          });

          document.addEventListener('mousedown', e => {
            if (!filter.contains(e.target) && !dropdown.contains(e.target)) {
              filter.classList.remove('open');
              dropdown.classList.remove('open');
            }
          });
        }

        // --- Populate Dropdown ---
        function populateYearsDropdown() {
          const dropdown = document.getElementById('customYearDropdown');
          dropdown.innerHTML = '<li class="active" data-value="">All Years</li>';
          const uniqueYears = Array.from(new Set(years.map(y => y.year || y)));
          uniqueYears.forEach(year => {
            const li = document.createElement('li');
            li.setAttribute('data-value', year);
            li.textContent = year;
            dropdown.appendChild(li);
          });
        }

        // --- Filter Cards ---
        function filterYearCards(selectedYear) {
          const cards = document.querySelectorAll('#yearsCardsGrid .year-card');
          cards.forEach(card => {
            const year = card.querySelector('.year-card-title')?.textContent.trim();
            card.parentElement.style.display = (!selectedYear || year === selectedYear) ? '' : 'none';
          });
        }

        // --- Render Years ---
        function renderYears() {
          showLoading();
          yearsCardsGrid.innerHTML = '';
          years.forEach((yearObj, idx) => {
            const yearValue = yearObj.year || yearObj;
            const col = document.createElement('div');
            col.className = 'col-lg-4 col-md-6 col-12';
            col.innerHTML = `
        <div class="year-card gray-year-card">
          <div class="year-card-avatar gray-year-card-avatar">
            <img src="../assets/hat_15681157 1.svg" width="56" height="56" alt="Hat icon">
          </div>
          <div class="year-card-title">${yearValue}</div>
          <div class="year-card-actions">
            <button class="year-edit-btn" data-idx="${idx}">Edit</button>
            <button class="year-delete-btn" data-idx="${idx}">Delete</button>
          </div>
        </div>
      `;
            yearsCardsGrid.appendChild(col);
          });
          hideLoading();

          populateYearsDropdown();
        }

        // --- Fetch Years from API ---
        async function loadYears() {
          showLoading();

          const res = await getYears();
          if (res?.status === "success") {
            years = res.data;
            renderYears();
          }

        }

        // --- Open/Close Popup ---
        function openYearPopup({ mode, value, index }) {
          yearPopupOverlay.style.display = 'block';
          yearPopupTitle.textContent = mode === 'edit' ? 'Edit Year' : 'Add A New Year';
          yearPopupSaveBtn.textContent = mode === 'edit' ? 'Save changes' : 'Add year';
          yearPopupInput.value = value || '';
          editingYearIndex = (typeof index === 'number') ? index : null;
          setTimeout(() => yearPopupInput.focus(), 100);
        }
        function closeYearPopup() {
          yearPopupOverlay.style.display = 'none';
          yearPopupInput.value = '';
          editingYearIndex = null;
        }
        yearPopupOverlay.onclick = e => { if (e.target === yearPopupOverlay) closeYearPopup(); };
        document.addEventListener('keydown', e => { if (yearPopupOverlay.style.display === 'block' && e.key === 'Escape') closeYearPopup(); });

        // --- Add Years Button ---
        document.querySelectorAll('.add-years-btn').forEach(btn => btn.addEventListener('click', () => openYearPopup({ mode: 'add' })));

        // --- Edit/Delete Event Delegation ---
        yearsCardsGrid.addEventListener('click', async e => {
          const editBtn = e.target.closest('.year-edit-btn');
          if (editBtn) {
            const idx = parseInt(editBtn.getAttribute('data-idx'));
            openYearPopup({ mode: 'edit', value: years[idx].year || years[idx], index: idx });
            return;
          }
          const deleteBtn = e.target.closest('.year-delete-btn');
        if (deleteBtn) {
    const idx = parseInt(deleteBtn.getAttribute('data-idx'));
    const year = years[idx];
    const id = year.id || year._id || idx + 1;

    showPopup(
        'confirm',
        'Delete Year',
        `Are you sure you want to delete this year?`,
        async () => {
            showLoading();
            const res = await deleteYear(id);

            if (res?.status === "success") {
                years.splice(idx, 1); // remove from array
                renderYears(); // re-render list
            }

            hideLoading();
            closePopup();
        }
    );

    return;
}

        });

        // --- Handle Add/Edit Form Submission ---
        yearPopupForm.onsubmit = async e => {
          showLoading();
          e.preventDefault();
          const yearValue = yearPopupInput.value.trim();
          if (!yearValue) return;
          hideLoading();

          if (editingYearIndex !== null) {
            const yearObj = years[editingYearIndex];
            const id = yearObj.id || yearObj._id || editingYearIndex + 1;
            const res = await editYear(id, yearValue);
            if (res?.status === "success") {
              years[editingYearIndex] = { ...yearObj, year: yearValue };
              renderYears();
              closeYearPopup();
              hideLoading();

            }
          } else {
            const res = await addYear(yearValue);
            if (res?.status === "success") {
              years.push(res.data);
              renderYears();
              closeYearPopup();
              hideLoading();
            }
          }
        };

        // --- Setup Custom Dropdown ---
        setupCustomDropdown('customYearFilter', 'customYearDropdown', 'customYearValue', 'year_hidden');
        document.getElementById('year_hidden').addEventListener('change', function () { filterYearCards(this.value); });

        // --- Initial Load ---
        await loadYears();
      });

      // ...existing code...

      // Bootstrap 5 modal instance
      let facultyModal = new bootstrap.Modal(document.getElementById('facultyModal'));

      // Open modal for Add
      function openAddFacultyModal() {
        document.getElementById('facultyModalLabel').textContent = 'Add Faculty';
        document.getElementById('facultyForm').reset();
        document.getElementById('facultyId').value = '';
        facultyModal.show();
      }

      // Open modal for Edit
      function openEditFacultyModal(faculty) {
        document.getElementById('facultyModalLabel').textContent = 'Edit Faculty';
        document.getElementById('facultyName').value = faculty.name;
        document.getElementById('facultyCode').value = faculty.code;
        document.getElementById('facultyDescription').value = faculty.description || '';
        document.getElementById('facultyId').value = faculty.id;
        facultyModal.show();
      }

      // Handle form submit
      document.getElementById('facultyForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const faculty = {
          id: document.getElementById('facultyId').value,
          name: document.getElementById('facultyName').value.trim(),
          code: document.getElementById('facultyCode').value.trim(),
          description: document.getElementById('facultyDescription').value.trim()
        };
        // TODO: Save faculty (AJAX or update UI)
        // Example: if (faculty.id) { updateFaculty(faculty); } else { addFaculty(faculty); }
        facultyModal.hide();
      });

      // Example: Attach to your Add/Edit buttons
      // document.querySelector('.add-faculty-btn').onclick = openAddFacultyModal;
      // document.querySelectorAll('.edit-faculty-btn').forEach(btn => {
      //   btn.onclick = () => openEditFacultyModal({id: ..., name: ..., code: ..., description: ...});
      // });

    </script>

<div class="menu-dots">

        </div>
    </div>
    <div id="toast-container"></div>
    <div id="popup-container"></div>
    <div id="loadingOverlayContainer" class="d-none w-full h-full"
        style="width: 100vw; height: 100vh; top: 0; left: 0; position: fixed;z-index: 999999999999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/loading.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/popup.js"></script>
    <script src="../js/loadscreen.js"></script>
    <script src="../js/departments.js"></script>



    <script>

  const urlParams = new URLSearchParams(window.location.search);
        const depId = urlParams.get("id");
        let dep;


         async function fetchDepartment() {
            showLoading();
            const res = await getDepartment(depId);
            if (res?.status === 'success') {
                dep = res.data;
                console.log(dep);
                renderDepartment(dep);
            }
            else {
                showToast("error", "Error", "Failed to fetch department", "");

            }
        }
async function renderDepartment(dep) {
            document.querySelector(".dep").textContent = dep.department.name + " Department"; 
            document.querySelector(".code").textContent = dep.department.code;
            document.querySelector(".faculty").textContent = "Faculty Of "+ dep.department.faculty.name;                      
            document.getElementById("users").innerText = dep.summary.users;
            document.getElementById("subjects").innerText = dep.summary.subjects;
            document.getElementById("tasks").innerText = dep.summary.tasks;
            document.getElementById("exams").innerText = dep.summary.exams;
            document.getElementById("Announcements").innerText = dep.summary.announcements;
            document.getElementById("Events").innerText = dep.summary.events;

        
 
  hideLoading();}



 document.querySelectorAll(".dep-menu").forEach(icon => {
                icon.onclick = e => {
                    e.stopPropagation();
                    const dropdown = e.currentTarget.nextElementSibling;
                    if (!dropdown) return;

                    // Close other dropdowns
                    document.querySelectorAll(".dep-dropdown").forEach(menu => {
                        if (menu !== dropdown) menu.classList.add("hidden");
                    });

                    // Toggle current
                    dropdown.classList.toggle("hidden");
                };
            });


            // Close when clicking outside
            document.addEventListener("click", () => {
                document.querySelectorAll(".dep-dropdown").forEach(menu => menu.classList.add("hidden"));
            });
            document.querySelector(".delete-dep").onclick = async e => {
                e.stopPropagation();

               showPopup(
    'confirm',
    'Delete Department',
    `Are you sure you want to delete this department?`,
    async () => {
        try {
            const res = await deleteDepartment(depId);

            if (res?.status === 'success') {
                showToast("success", "Deleted", "Department deleted successfully", "/admin/departments.html");
            } else {
                showToast("error", "Error", res?.message || "Failed to delete department", "");
            }
        } catch (err) {
            showToast("error", "Error", err.message || "Failed to delete department", "");
        } finally {
            closePopup();
        }
    }
);

            };









    document.addEventListener("DOMContentLoaded", async () => {
            showLoading();
            await fetchDepartment();
        });
    </script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account Settings</title>
  <link rel="stylesheet" href="./css/account-setting.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/sidebar.css" />
</head>
<body>
  <div id="sidebar-container"></div>
    <div id="content-wrapper" class="sidebar-hidden" style="transition: margin-left 0.3s;">
      <div class="row">
        <div id="navbar-container" class="fixed-top"></div>
      </div>
    <div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="card personal-details-card w-100" style="border-radius: 12px; border-style: none;">
        <div class="personal-details-header mb-4">
          <h4 class=" personal-details-title mb-0">Account Settings</h4>
          <div class="personal-details-underline"></div>
        </div>
        <form>
          <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
              <label class="form-label personal-details-label">Faculty</label>
              <select class="form-select input-icon-right" required>
                <option value="" disabled selected hidden>Cairo university</option>
                <option value="cairo">Cairo university</option>
                <option value="alex">Alexandria university</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label personal-details-label">Department</label>
              <select class="form-select input-icon-right" required>
                <option value="" disabled selected hidden>Special education</option>
                <option value="special">Special education</option>
                <option value="math">Mathematics</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label personal-details-label">Year</label>
              <select class="form-select input-icon-right" required>
                <option value="" disabled selected hidden>Third year</option>
                <option value="prep">Preparatory year</option>
                <option value="first">First year</option>
                <option value="second">Second year</option>
                <option value="third">Third year</option>
                <option value="fourth">Fourth year</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label personal-details-label">Study Type</label>
              <select class="form-select input-icon-right" required>
                <option value="" disabled selected hidden>Mainstream / Credit</option>
                <option value="mainstream">Mainstream</option>
                <option value="credit">Credit</option>
              </select>
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-purple personal-details-save">Save change</button>
          </div>
        </form>
      </div>
    </div>
    <div id="toasts-container"></div>
  </div>
  <script>
      // Fetch and inject sidebar
      fetch('./components/sidebar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('sidebar-container').innerHTML = html;
        });
      // Fetch and inject navbar
      fetch('./components/navbar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('navbar-container').innerHTML = html;
        });
      // Sidebar toggle logic (example, adjust as needed)
      function toggleSidebar(active) {
        const contentWrapper = document.getElementById('content-wrapper');
        if (active) {
          contentWrapper.style.marginLeft = '250px'; // Adjust to your sidebar width
        } else {
          contentWrapper.style.marginLeft = '0';
        }
      }
      // Optionally, call toggleSidebar(true/false) based on sidebar state
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script src="./js/loading.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script src="./js/loading.js"></script>
</body>
</html>

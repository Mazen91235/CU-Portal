<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./css/accsettcss.css" />
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="components/navbar.html" />
  <link rel="stylesheet" href="components/sidebar.html" />
  <link rel="stylesheet" href="css/sidebar.css" />
  

  <link rel="stylesheet" href="./components/navbar.html" />
  <link rel="stylesheet" href="./components/sidebar.html" />
  <link rel="stylesheet" href="./components/toasts.html" />
  <link rel="stylesheet" href="./css/sidebar.css" />

</head>
<body>
  <div id="sidebar-container"></div>
  <div id="content-wrapper" class="sidebar-hidden">
    <div class="row">
      <div id="navbar-container" class="fixed-top"></div></div></div>
      

      <!-- Personal Details Section -->
      <div class="container mt-5">
        <div class="card personal-details-card mx-auto">
          <div class="personal-details-header mb-4">
            <h4 class="fw-bold personal-details-title mb-0">Personal Details</h4>
            <div class="personal-details-underline"></div>
          </div>
          <div class="d-flex align-items-center mb-4 gap-3">
            <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile" class="rounded-circle personal-details-avatar">
            <button class="btn btn-purple me-2">Upload New</button>
            <button class="btn personal-details-remove">Remove Profile Photo</button>
          </div>
          <form>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold personal-details-label">Full Name</label>
                <div class="input-group">
                  <input type="text" class="form-control" placeholder="somia ali mohmad" />
                  <span class="input-group-text bg-white border-start-0"><i class="fa-regular fa-user"></i></span>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold personal-details-label">Email</label>
                <div class="input-group">
                  <input type="email" class="form-control" placeholder="aliahmed@gimal.com" />
                  <span class="input-group-text bg-white border-start-0"><i class="fa-regular fa-envelope"></i></span>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold personal-details-label">Phone Number</label>
                <div class="input-group">
                  <span class="input-group-text">+2</span>
                  <input type="text" class="form-control" placeholder="01016424526" />
                  <span class="input-group-text bg-white border-start-0"><i class="fa-solid fa-phone"></i></span>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold personal-details-label">National ID</label>
                <div class="input-group">
                  <input type="text" class="form-control" placeholder="Enter Your National ID" />
                  <span class="input-group-text bg-white border-start-0"><i class="fa-regular fa-id-card"></i></span>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold personal-details-label">Gender</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0"><i class="fa-regular fa-user"></i></span>
                  <select class="form-select border-start-0">
                    <option selected>select your gender</option>
                    <option>Male</option>
                    <option>Female</option>
                  </select>
                  <span class="input-group-text bg-white border-start-0"><i class="fa-solid fa-venus-mars"></i></span>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold personal-details-label">Google Account</label>
                <div class="input-group">
                  <input type="text" class="form-control" placeholder="Enter Your Google Account" />
                  <span class="input-group-text bg-white border-start-0"><i class="fa-brands fa-google"></i></span>
                </div>
              </div>
            </div>
            <div class="d-flex flex-column align-items-center mt-4 gap-3">
              <button type="submit" class="btn btn-purple personal-details-save">Save change</button>
              <button type="button" class="btn btn-light d-flex align-items-center justify-content-center personal-details-google">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="me-2 personal-details-google-img">
                Change Google account
              </button>
            </div>
          </form>
        </div>
      </div>
      <!-- End Personal Details Section -->
  <script>
    // Fetch and inject sidebar
    fetch('./components/sidebar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
      });
    // Fetch and inject navbar
    fetch('./components/navbar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('navbar-container').innerHTML = html;
      });
  </script>
   <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


  <script src="./js/loading.js"></script>

</body>
</html>

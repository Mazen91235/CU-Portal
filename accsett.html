  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/accsettcss.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="./css/sidebar.css" />
   <!-- <link rel="stylesheet" href="./components/navbar.html" />
    <link rel="stylesheet" href="./components/sidebar.html" />
    <link rel="stylesheet" href="./components/toasts.html" />-->
    <link rel="stylesheet" href="./css/sidebar.css" />
  </head>
  <body>
  <div id="sidebar-container"></div>
    <div id="content-wrapper" class="sidebar-hidden" style="transition: margin-left 0.3s;">
      <div class="row">
        <div id="navbar-container" class="fixed-top"></div>
      </div>
      <!-- Personal Details Section -->
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-12 col-lg-11">
            <div class="card personal-details-card w-100" style="margin: 2rem;">
              <div class="personal-details-header mb-4">
                <h4 class="fw-bold personal-details-title mb-0">Personal Details</h4>
                <div class="personal-details-underline"></div>
              </div>
              <div class="personal-details-btn-group mb-4">
                <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile" class="rounded-circle personal-details-avatar">
                <button class="btn btn-purple">Upload New</button>
                <button class="btn personal-details-remove">Remove Profile Photo</button>
              </div>
              <form>
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Full Name</label>
                    <input type="text" class="form-control input-icon-right icon-user" placeholder="somia ali mohmad" style="width: 443px;" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Email</label>
                    <input type="email" class="form-control input-icon-right icon-envelope" placeholder="aliahmed@gimal.com" style="width: 443px;" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Phone Number</label>
                    <input type="text" class="form-control phone-code phone-icon-right" placeholder="01016424526" style="width: 443px;" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">National ID</label>
                    <input type="number"  class="no-spinner form-control input-icon-right icon-idcard" placeholder="Enter Your National ID" style="width: 443px;" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Gender</label>
                    <select class="form-select input-icon-right icon-venus-mars" style="width: 443px;" required>
                      <option value="" disabled selected hidden>Select your gender</option>
                      <option value="male">Male</option>
                      <option value="female">Female</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold personal-details-label">Google Account</label>
                    <input type="text" class="form-control input-icon-right icon-google" placeholder="Enter Your Google Account" style="width: 443px;" />
                  </div>
                </div>
                <div class="d-flex flex-column align-items-center mt-4 gap-3">
                  <button type="submit" class="btn btn-purple personal-details-save">Save change</button>
                  <button type="button" class="btn btn-light d-flex align-items-center justify-content-center personal-details-google">
                    <img src="./assets/Group 4.png" alt="Google" class="me-2 personal-details-google-img">
                    Change Google account
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <!-- End Personal Details Section -->
    </div>
    <script>
      // Fetch and inject sidebar
      fetch('./components/sidebar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('sidebar-container').innerHTML = html;
        });
      // Fetch and inject navbar
      fetch('./components/navbar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('navbar-container').innerHTML = html;
        });
      // Sidebar toggle logic (example, adjust as needed)
      function toggleSidebar(active) {
        const contentWrapper = document.getElementById('content-wrapper');
        if (active) {
          contentWrapper.style.marginLeft = '250px'; // Adjust to your sidebar width
        } else {
          contentWrapper.style.marginLeft = '0';
        }
      }
      // Optionally, call toggleSidebar(true/false) based on sidebar state
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script src="./js/loading.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script src="./js/loading.js"></script>

  </body>
  </html>

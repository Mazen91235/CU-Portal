    <style>
      /* --- Popup Dropdown Fix --- */
      .custom-filter-container {
        position: relative;
        display: inline-block;
      }
      .custom-filter {
        cursor: pointer;
        user-select: none;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 8px 16px;
        min-width: 180px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .custom-dropdown-list {
        display: none;
        position: absolute;
        top: 110%;
        left: 0;
        right: 0;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        z-index: 1000;
        margin: 0;
        padding: 0;
        list-style: none;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      .custom-filter.open + .custom-dropdown-list,
      .custom-dropdown-list.open {
        display: block;
      }
      .custom-dropdown-list li {
        padding: 10px 16px;
        cursor: pointer;
      }
      .custom-dropdown-list li.active,
      .custom-dropdown-list li:hover {
        background: #f0f0f0;
      }

      /* Custom Year Popup Modal */
      #yearPopupOverlay {
        display: none;
        position: fixed;
        z-index: 2000;
        left: 0; top: 0; right: 0; bottom: 0;
        background: rgba(60,60,60,0.6);
      }
      #yearPopupModal {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        background: #fff;
        border-radius: 22px;
        padding: 32px 28px 28px 28px;
        min-width: 320px;
        box-shadow: 0 4px 32px rgba(0,0,0,0.12);
        text-align: center;
      }
      #yearPopupModal h2 {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 2rem;
        margin-bottom: 22px;
        background: linear-gradient(90deg, #ff7ecb 0%, #7d26c9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #yearPopupInput {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #d09adf;
        border-radius: 8px;
        font-size: 1.1rem;
        margin-bottom: 24px;
        outline: none;
        transition: border 0.2s;
      }
      #yearPopupInput:focus {
        border-color: #7d26c9;
      }
      #yearPopupSaveBtn {
        width: 100%;
        background: #7d26c9;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 0;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
        transition: background 0.2s;
      }
      #yearPopupSaveBtn:hover {
        background: #a14fdc;
      }
    </style>

    <script>
    // --- Custom Dropdown Logic for Year Filter ---
    function setupCustomDropdown(filterId, dropdownId, valueId, hiddenId) {
      const filter = document.getElementById(filterId);
      const dropdown = document.getElementById(dropdownId);
      const valueSpan = document.getElementById(valueId);
      const hiddenInput = document.getElementById(hiddenId);

      // Toggle dropdown open/close
      filter.addEventListener('click', function (e) {
        e.stopPropagation();
        // Close other dropdowns
        document.querySelectorAll('.custom-filter.open').forEach(f => {
          if (f !== filter) f.classList.remove('open');
        });
        filter.classList.toggle('open');
        // Show/hide dropdown
        if (filter.classList.contains('open')) {
          dropdown.classList.add('open');
        } else {
          dropdown.classList.remove('open');
        }
      });

      // Select dropdown item
      dropdown.addEventListener('click', function(e) {
        const li = e.target.closest('li');
        if (!li) return;
        dropdown.querySelectorAll('li').forEach(item => item.classList.remove('active'));
        li.classList.add('active');
        valueSpan.textContent = li.textContent;
        hiddenInput.value = li.getAttribute('data-value');
        filter.classList.remove('open');
        dropdown.classList.remove('open');
        hiddenInput.dispatchEvent(new Event('change'));
      });

      // Close dropdown when clicking outside
      document.addEventListener('mousedown', function (e) {
        if (!filter.contains(e.target) && !dropdown.contains(e.target)) {
          filter.classList.remove('open');
          dropdown.classList.remove('open');
        }
      });
    }

    // Filtering logic
    function filterYearCards(selectedYear) {
        const cards = document.querySelectorAll('#yearsCardsGrid .year-card');
        cards.forEach(card => {
            const year = card.querySelector('.year-card-title')?.textContent.trim();
            if (!selectedYear || year === selectedYear) {
                card.parentElement.style.display = '';
            } else {
                card.parentElement.style.display = 'none';
            }
        });
    }

    // Populate custom dropdown with years from cards
    function populateYearsDropdown() {
      const cards = document.querySelectorAll('#yearsCardsGrid .year-card-title');
      const years = Array.from(cards).map(card => card.textContent.trim());
      const uniqueYears = Array.from(new Set(years));
      const dropdown = document.getElementById('customYearDropdown');
      // Remove all except "All Years"
      dropdown.innerHTML = '<li class="active" data-value="">All Years</li>';
      uniqueYears.forEach(year => {
        const li = document.createElement('li');
        li.setAttribute('data-value', year);
        li.textContent = year;
        dropdown.appendChild(li);
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      populateYearsDropdown();
      setupCustomDropdown('customYearFilter', 'customYearDropdown', 'customYearValue', 'year_hidden');
      // Initial filter (show all)
      filterYearCards('');
      // Attach filter to hidden input
      document.getElementById('year_hidden').addEventListener('change', function() {
        filterYearCards(this.value);
      });

      // --- Custom Year Popup Modal Logic ---
      const yearPopupOverlay = document.getElementById('yearPopupOverlay');
      const yearPopupTitle = document.getElementById('yearPopupTitle');

      const yearPopupForm = document.getElementById('yearPopupForm');
      const yearsCardsGrid = document.getElementById('yearsCardsGrid');

      // Store years in memory for demo (replace with backend in real app)
      let years = Array.from(document.querySelectorAll('#yearsCardsGrid .year-card-title')).map(e => e.textContent.trim());

const API_BASE = "{{baseURL}}/api/v1/admin/years?year"; // adjust to your backend

async function fetchYears() {
  try {
    const res = await fetch(API_BASE);
    const data = await res.json();
    years = data; 
    renderYears();
  } catch (err) {
    console.error("Error fetching years", err);
  }
}
      function renderYears() {
        yearsCardsGrid.innerHTML = '';
        years.forEach((year, idx) => {
          const col = document.createElement('div');
          col.className = 'col-lg-4 col-md-6 col-12';
          col.innerHTML = `
            <div class="year-card gray-year-card">
              <div class="year-card-avatar gray-year-card-avatar">
                <img src="./assets/haticon.png" alt="Year Icon">
              </div>
              <div class="year-card-title">${year}</div>
              <div class="year-card-actions">
                <button class="year-edit-btn" data-idx="${idx}">Edit</button>
                <button class="year-delete-btn" data-idx="${idx}">Delete</button>
              </div>
            </div>
          `;
          yearsCardsGrid.appendChild(col);
        });
        // Refresh dropdown/filter
        populateYearsDropdown && populateYearsDropdown();
      }

      function openYearPopup({mode, value, index}) {
        yearPopupOverlay.style.display = 'block';
        yearPopupTitle.textContent = mode === 'edit' ? 'Edit Year' : 'Add A New Year';
        yearPopupSaveBtn.textContent = mode === 'edit' ? 'Save changes' : 'Add year';
        yearPopupInput.value = value || '';
        editingYearIndex = (typeof index === 'number') ? index : null;
        setTimeout(() => yearPopupInput.focus(), 100);
      }
      function closeYearPopup() {
        yearPopupOverlay.style.display = 'none';
        yearPopupInput.value = '';
        editingYearIndex = null;
      }
      yearPopupOverlay.onclick = function(e) {
        if (e.target === yearPopupOverlay) closeYearPopup();
      };
      document.addEventListener('keydown', function(e) {
        if (yearPopupOverlay.style.display === 'block' && e.key === 'Escape') closeYearPopup();
      });

      // Add Years button (both mobile and desktop)
      document.querySelectorAll('.add-years-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          openYearPopup({mode: 'add'});
        });
      });

      // Edit/Delete buttons on year cards (event delegation for dynamic support)
      yearsCardsGrid.addEventListener('click', function(e) {
        const editBtn = e.target.closest('.year-edit-btn');
        if (editBtn) {
          const idx = parseInt(editBtn.getAttribute('data-idx'));
          openYearPopup({mode: 'edit', value: years[idx], index: idx});
          return;
        }
        const deleteBtn = e.target.closest('.year-delete-btn');
        if (deleteBtn) {
          const idx = parseInt(deleteBtn.getAttribute('data-idx'));
          if (confirm(`Are you sure you want to delete year "${years[idx]}"?`)) {
            years.splice(idx, 1);
            renderYears();
          }
          return;
        }
      });

      // Handle form submit (Add/Edit)
      yearPopupForm.onsubmit = function(e) {
        e.preventDefault();
        const yearValue = yearPopupInput.value.trim();
        if (!yearValue) return;
        if (editingYearIndex !== null) {
          // Edit mode
          years[editingYearIndex] = yearValue;
        } else {
          // Add mode
          years.push(yearValue);
        }
        renderYears();
        closeYearPopup();
      };

      // Initial render (if needed)
      renderYears();
    });

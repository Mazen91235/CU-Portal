    <script>
const filterBtn = document.getElementById('filterDropdownBtn');
const arrow = document.querySelector('.dropdown-arrow i');
const dropdownMenu = document.querySelector('.filter-dropdown-menu');
const filterBtnText = document.querySelector('.filter-btn-text');
const yearsCardsGrid = document.getElementById('yearsCardsGrid');
const yearsFilterList = document.getElementById('yearsFilterList');

// Filtering logic
function filterYearCards(selectedYear) {
    const cards = document.querySelectorAll('#yearsCardsGrid .year-card');
    cards.forEach(card => {
        const year = card.querySelector('.year-card-title')?.textContent.trim();
        if (selectedYear === 'All Years' || year === selectedYear) {
            card.parentElement.style.display = '';
        } else {
            card.parentElement.style.display = 'none';
        }
    });
}

// Dynamically populate filter dropdown with years from cards
function populateYearsFilter() {
    const cards = document.querySelectorAll('#yearsCardsGrid .year-card-title');
    const years = Array.from(cards).map(card => card.textContent.trim());
    const uniqueYears = Array.from(new Set(years));
    yearsFilterList.innerHTML = '';
    // Add "All Years" option
    const allYearsLi = document.createElement('li');
    allYearsLi.innerHTML = '<a class="dropdown-item active" href="#">All Years</a>';
    yearsFilterList.appendChild(allYearsLi);
    uniqueYears.forEach(year => {
        const li = document.createElement('li');
        li.innerHTML = `<a class="dropdown-item" href="#">${year}</a>`;
        yearsFilterList.appendChild(li);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    populateYearsFilter();

    // Dropdown arrow logic
    if (filterBtn && arrow && dropdownMenu && filterBtnText) {
        filterBtn.addEventListener('click', function() {
            arrow.classList.toggle('rotate-arrow');
        });
        document.addEventListener('click', function(e) {
            if (!filterBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                arrow.classList.remove('rotate-arrow');
            }
        });

        yearsFilterList.addEventListener('click', function(e) {
            const item = e.target.closest('.dropdown-item');
            if (item) {
                e.preventDefault();
                // Remove active from all
                yearsFilterList.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active'));
                // Add active to selected
                item.classList.add('active');
                // Update button text
                filterBtnText.textContent = item.textContent;
                arrow.classList.remove('rotate-arrow');
                filterYearCards(item.textContent.trim());
            }
        });

        // Initial filter (show all)
        filterYearCards('All Years');
    }
});
</script>
